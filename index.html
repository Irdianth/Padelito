<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padelito</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&display=swap">
<style>
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --ink:#0B0B0C; --muted:#5E5E63; --border:#DAD9D4;
  --court:#1B4FB8; --court-deep:#143D90; --ball:#F3CF55; --on-court:#FFFFFF;
  --accent:#8A6710; --gold:#C9A227; --btn-bg:#0B0B0C; --btn-fg:#EBCB62; --danger:#B8322A; --chip:#E9E8E3;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070707; --surface:#141414; --ink:#F4F2EC; --muted:#A7A49B; --border:#2D2C28;
    --accent:#DDBB4F; --gold:#D4AF37; --btn-bg:#D4AF37; --btn-fg:#0B0B0C; --danger:#FF8D84; --chip:#22211D;
  }
}
:root[data-theme="dark"]{
  --bg:#070707; --surface:#141414; --ink:#F4F2EC; --muted:#A7A49B; --border:#2D2C28;
  --accent:#DDBB4F; --gold:#D4AF37; --btn-bg:#D4AF37; --btn-fg:#0B0B0C; --danger:#FF8D84; --chip:#22211D;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:10px}
.top h1{font-family:var(--display);font-weight:700;font-style:italic;text-transform:uppercase;font-size:32px;line-height:1.05;margin:0;letter-spacing:.02em;overflow-wrap:anywhere}
.top h1::before{content:"★";color:var(--gold);font-style:normal;margin-right:8px;font-size:.8em;position:relative;top:-.08em}
.status{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.live i{background:#2FB56A}

main{padding-bottom:104px}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:18px 0 10px;line-height:1.1}
h2 small{font-family:var(--body);font-weight:400;font-size:15px;color:var(--muted);margin-left:6px}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.error{color:var(--danger);font-size:14px;margin:8px 0 0}

/* round picker */
.rounds{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.rounds::-webkit-scrollbar{display:none}
.rounds button{flex:0 0 auto;min-width:44px;height:44px;border-radius:22px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--display);font-weight:600;font-size:20px;padding:0 12px}
.rounds button.done{background:var(--chip);border-color:var(--chip)}
.rounds button[aria-current="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}

/* the court */
.match{margin:0 0 18px}
.match h3{font-size:14px;font-weight:500;color:var(--muted);margin:0 0 6px}
.court{background:var(--court);border-radius:14px;padding:9px;color:var(--on-court)}
.lines{position:relative;display:grid;grid-template-columns:1fr 1fr;border:2px solid rgba(255,255,255,.92);border-radius:3px;min-height:136px}
.lines::before{content:"";position:absolute;left:12%;right:12%;top:50%;border-top:2px solid rgba(255,255,255,.3)}
.lines::after{content:"";position:absolute;left:50%;top:-7px;bottom:-7px;border-left:3px dotted #fff;transform:translateX(-1.5px)}
.half{position:relative;display:grid;align-items:stretch;background:none;border:0;color:inherit;padding:0;text-align:left;min-width:0;border-radius:2px}
.half.a{grid-template-columns:minmax(0,1fr) auto}
.half.b{grid-template-columns:auto minmax(0,1fr);text-align:right}
.half::before{content:"";position:absolute;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.3)}
.half.a::before{left:24%}
.half.b::before{right:24%}
button.half:active{background:var(--court-deep)}
.names{display:grid;grid-template-rows:1fr 1fr;min-width:0;position:relative}
.names span{display:flex;align-items:center;padding:0 10px;font-weight:600;font-size:17px;line-height:1.15;min-width:0}
.names span b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;min-width:0}
.half.b .names span{justify-content:flex-end}
.score{position:relative;align-self:center;background:var(--court);font-family:var(--display);font-weight:700;font-size:60px;line-height:1;min-width:64px;text-align:center;padding:6px 8px;font-variant-numeric:tabular-nums}
button.half:active .score{background:var(--court-deep)}
.score{display:flex;flex-direction:column;align-items:center}
.score.none{opacity:.55;font-weight:500}
.pt{font-family:var(--body);font-size:16px;font-weight:600;line-height:1.35;background:rgba(255,255,255,.2);border-radius:10px;padding:0 9px;margin-top:3px;min-width:38px}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;margin-bottom:14px}
.sb-col{text-align:center;min-width:0}
.sb-cap{font-size:13px;color:var(--muted);margin:0 0 6px}
.sb-name{font-weight:600;margin:0;min-height:2.6em;line-height:1.3;overflow-wrap:anywhere}
.sb-g{font-family:var(--display);font-weight:700;font-size:76px;line-height:1;margin:4px 0 0;font-variant-numeric:tabular-nums}
.sb-p{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;color:var(--accent);margin:0 0 10px}
.sb .btn{min-height:64px;font-size:18px}
.gstep{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
.gstep button{width:44px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:20px;font-weight:600;color:var(--ink)}
.note{font-family:var(--body);font-size:15px;font-weight:600;color:var(--accent);margin-left:8px}
.half.win .score{color:var(--ball)}
.rest{font-size:15px;color:var(--muted);margin:2px 0 18px}
.rest strong{color:var(--ink);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:16px}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.btn.danger{color:var(--danger)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* standings */
.table-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:13px;font-weight:500;color:var(--muted);text-align:right;padding:10px 8px 8px;white-space:nowrap}
td{padding:11px 8px;text-align:right;border-top:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{padding-left:14px;text-align:left;width:36px;color:var(--muted)}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;overflow-wrap:anywhere}
th:last-child,td:last-child{padding-right:14px}
td.name{font-weight:600}
td.pts{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
tr.lead td:first-child{color:var(--ink);font-weight:600}
tr.lead td.pts{color:var(--accent)}

.champ{background:#0B0B0C;color:#fff;border:1.5px solid var(--gold);border-radius:14px;padding:18px 18px 16px;margin:0 0 14px}
.champ p{margin:0}
.champ-l{font-size:15px;font-weight:500;opacity:.9}
.champ-n{font-family:var(--display);font-weight:700;font-size:48px;line-height:1.05;overflow-wrap:anywhere;color:var(--ball)}
.champ-s{font-size:15px;margin-top:6px!important}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;padding:12px 0;margin-top:8px;display:block;width:100%;text-align:center}
.past{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:0 0 10px;overflow:hidden}
.past summary{padding:13px 16px;cursor:pointer;font-weight:600;list-style-position:inside}
.past summary span{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.past .table-scroll{border:0;border-top:1px solid var(--border);border-radius:0}
.past .row{padding:12px 16px}
td.best{font-weight:700;color:var(--accent)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.plink{background:none;border:0;padding:6px 0;font-weight:600;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px;text-decoration-thickness:2px}
.back{background:none;border:0;padding:10px 0;margin-top:8px;color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}
.stats div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
table.free th:first-child,table.free td:first-child{width:auto;color:var(--ink);font-weight:600}
table.free td:nth-child(2) small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.plist{list-style:none;margin:0 0 14px;padding:0 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border)}
.plist li:first-child{border-top:0}
.plist span{font-weight:600;min-width:0;overflow-wrap:anywhere}
.plist li.out span{color:var(--muted);font-weight:500}
.plist small,.tag{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.btn.small{min-height:40px;padding:0 14px;font-size:15px;flex:0 0 auto}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.quick button{border:1.5px solid var(--border);background:var(--surface);border-radius:20px;height:40px;padding:0 14px;font-weight:600}
.notice{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:15px;margin:0 0 14px}
.pairs{list-style:none;margin:10px 0 0;padding:0 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.pairs li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border)}
.pairs li:first-child{border-top:0}
.pairs i{font-style:normal;color:var(--muted);font-size:14px;width:48px;flex:0 0 auto}
.pairs button{flex:1 1 0;min-width:0;height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.pairs button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.pairs em{flex:1 1 0;font-style:normal;color:var(--muted);font-size:14px;text-align:center}
textarea{width:100%;min-height:150px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--ink);padding:12px 14px;font:inherit;font-size:16px;resize:vertical}
.plist .acts{display:flex;gap:6px;flex:0 0 auto}
.plist .x2{width:40px;height:40px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);font-size:20px;line-height:1;color:var(--muted)}
.sheet .plist{background:var(--bg)}
.big{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
.big-in{max-width:900px;margin:0 auto}
.big h2{font-size:clamp(34px,9vw,72px);margin:0 0 10px;text-transform:uppercase;font-style:italic;line-height:1}
.big .crt{border-top:3px solid var(--gold);padding:14px 0 16px}
.big .crt h3{font-size:clamp(16px,3.6vw,26px);color:var(--muted);font-weight:500;margin:0 0 6px}
.big .pr{font-family:var(--display);font-weight:700;font-size:clamp(32px,9vw,88px);line-height:1.05;margin:0;overflow-wrap:anywhere}
.big .vs{font-size:clamp(16px,3.6vw,26px);color:var(--accent);margin:4px 0;font-weight:600}
.big .rest{font-size:clamp(20px,5vw,36px);margin:0;padding:14px 0;border-top:3px solid var(--border);color:var(--muted)}
.big .rest strong{color:var(--ink)}
.undo{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:9;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.undo button{border:0;background:var(--gold);color:#0B0B0C;font-weight:700;border-radius:8px;min-height:40px;padding:0 16px}
/* setup */
.field{margin:18px 0 0;border:0;padding:0;min-width:0}
.field>label,.field>legend{display:block;font-weight:600;font-size:15px;margin:0 0 8px;padding:0}
input[type=text]{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);padding:0 14px;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.seg button{height:46px;border:0;background:none;font-weight:600;border-left:1.5px solid var(--border)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{width:52px;height:46px;border:0;background:none;font-size:22px;font-weight:600}
.stepper output{min-width:44px;text-align:center;font-family:var(--display);font-weight:700;font-size:24px}
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:12px 0 0}
.chips li{display:inline-flex;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:22px;font-weight:500;max-width:100%}
.chips li.on{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.chips .who{border:0;background:none;height:40px;padding:0 4px 0 14px;font-weight:600;color:inherit;border-radius:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:auto}
.chips li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips .x{border:0;background:none;width:36px;height:40px;font-size:20px;line-height:1;color:var(--muted);border-radius:20px;flex:0 0 auto}
.chips li.on .x{color:inherit;opacity:.7}
.start{margin-top:26px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px 16px;margin:0 0 16px}
.card dl{margin:0}
.card div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--border)}
.card div:first-child{border-top:0}
.card dt{color:var(--muted)}
.card dd{margin:0;font-weight:600;text-align:right}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:26px;font-weight:600;margin-bottom:6px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{height:60px;border:0;background:none;font-weight:600;font-size:15px;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:28%;right:28%;top:0;height:3px;background:var(--gold);border-radius:0 0 3px 3px}

/* score sheet */
.scrim{position:fixed;inset:0;background:rgba(6,12,32,.55);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;animation:up .18s ease-out}
.sheet>*{max-width:528px;margin-left:auto;margin-right:auto}
.sheet h2{margin-top:0;overflow-wrap:anywhere}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px;margin-bottom:16px}
.nums button{height:52px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);font-family:var(--display);font-weight:600;font-size:24px}
.nums button[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:#fff}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (max-width:360px){.score{font-size:50px;min-width:54px}.names span{font-size:15px;padding:0 8px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">Padelito</h1>
    <div class="status" id="status" hidden></div>
  </header>
  <main id="app"></main>
</div>
<nav class="tabs" id="tabs" hidden aria-label="Sections"></nav>
<div id="sheet"></div>
<div id="undo"></div>

<script>
(function(){
"use strict";

/* ---------- storage ---------- */
var LS="padel.tournament.v2", LSD="padel.draft.v1";
var store={
  get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set:function(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

var T=store.get(LS);
function valid(d){return !!(d&&d.v===2&&d.players&&d.rounds)}
if(!valid(T))T=null;
var draft=Object.assign({name:"",format:"americano",mode:"first",n:6,deuce:"golden",courts:2,players:[]},store.get(LSD)||{});
if(!Array.isArray(draft.players))draft.players=[];
if(["first","best","total","set"].indexOf(draft.mode)<0)draft.mode="first";
if([4,5,6].indexOf(draft.n)<0)draft.n=6;
if(draft.rank!=="games")draft.rank="wins";
/* Usual players. Names listed here are added to the saved list the first time the app opens in a browser. */
var REGULARS=["Puwi","Rinto","Jimmy","Otto","Erik","Brian","Arwin","Vanessa","Erwin","Darwin"];
var LSR="padel.roster.v1", LSH="padel.history.v1", LSS="padel.seeded.v1";
var roster=store.get(LSR);if(!Array.isArray(roster))roster=draft.players.slice();
var hist=store.get(LSH);if(!Array.isArray(hist))hist=[];
function sameName(a,b){return a.trim().toLowerCase()===b.trim().toLowerCase()}
function inRoster(nm){for(var i=0;i<roster.length;i++)if(sameName(roster[i],nm))return roster[i];return null}
(function seed(){
  var done=store.get(LSS)||[];
  REGULARS.forEach(function(nm){
    if(done.indexOf(nm)<0){done.push(nm);if(!inRoster(nm))roster.push(nm)}
  });
  store.set(LSS,done);store.set(LSR,roster);
})();
draft.players=draft.players.filter(function(nm){return roster.indexOf(nm)>=0});
var ui={tab:"matches",round:0,sheet:null,confirmEnd:false,err:"",hsort:"win",confirmDel:null,player:null,pmsg:"",perr:"",swap:null,paste:null,ren:null,big:null,undo:null};
var hasHost=!!(window.claude&&typeof window.claude.use==="function");
/* Online database (Firebase). Used when the app runs on its own site. */
var FIREBASE={
  apiKey:"AIzaSyBM_VxHNbDhwksrRFvvXf_232WDl0nkt_4",
  authDomain:"padelito-915cc.firebaseapp.com",
  projectId:"padelito-915cc",
  storageBucket:"padelito-915cc.firebasestorage.app",
  messagingSenderId:"548155605657",
  appId:"1:548155605657:web:55851bbe31840da6cfae08"
};
var FB_SDK="https://www.gstatic.com/firebasejs/10.12.2/";
var useFb=!hasHost&&!!(FIREBASE&&FIREBASE.projectId);
var LSRD="padel.roster.dirty.v1", LSHU="padel.history.unsynced.v1";
var cloud={pending:(hasHost||useFb)&&!T,ref:null,canWrite:true,live:false,ignoreRev:0,fb:false,syncedRev:0,touched:false};

var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- tournament logic ---------- */
function pairKey(a,b){return a<b?a+"|"+b:b+"|"+a}
function nameOf(id){for(var i=0;i<T.players.length;i++)if(T.players[i].id===id)return T.players[i].name;return"?"}
var PTS=["0","15","30","40"];
/* match length: first to n, best of n, n games in total, or a full set */
function ml(t){
  if(t.mode)return{mode:t.mode,n:Number(t.n)||6};
  return t.len==="set"?{mode:"set",n:6}:{mode:"first",n:Number(t.len)||6};
}
function lenLabel(t){
  var r=ml(t);
  return r.mode==="set"?"Full set":r.mode==="best"?"Best of "+r.n+" games":r.mode==="total"?r.n+" games in total":"First to "+r.n+" games";
}
function lenHint(t){
  var r=ml(t),n=r.n,even=n%2===0,need=Math.floor(n/2)+1;
  if(r.mode==="set")return"First to 6 games, two clear. At 6–6 a tiebreak to 7 points decides it.";
  if(r.mode==="best")return"Up to "+n+" games. The first pair to win "+need+" takes the match"+(even?", and "+n/2+"–"+n/2+" is a tie.":".");
  if(r.mode==="total")return"All "+n+" games are played whatever the score, and every game won counts in the standings."+(even?" "+n/2+"–"+n/2+" is a tie.":"");
  return"The first pair to win "+n+" games takes the match.";
}
function gamesOver(t,ga,gb){
  var r=ml(t),n=r.n;
  if(r.mode==="set")return ((ga>=6||gb>=6)&&Math.abs(ga-gb)>=2)||ga>=7||gb>=7;
  if(r.mode==="total")return ga+gb>=n;
  if(r.mode==="best"){var need=Math.floor(n/2)+1;return ga>=need||gb>=need||ga+gb>=n}
  return ga>=n||gb>=n;
}
/* replay the point log on top of the games already banked */
function score(m,t){
  var isSet=ml(t).mode==="set";
  var ga=m.base[0],gb=m.base[1],pa=0,pb=0,over=gamesOver(t,ga,gb),log=m.log||"";
  for(var i=0;i<log.length&&!over;i++){
    var tb=isSet&&ga===6&&gb===6,won=false;
    if(log[i]==="a")pa++;else pb++;
    if(tb)won=(pa>=7||pb>=7)&&Math.abs(pa-pb)>=2;
    else if(t.deuce==="golden")won=pa>=4||pb>=4;
    else won=(pa>=4||pb>=4)&&Math.abs(pa-pb)>=2;
    if(won){if(pa>pb)ga++;else gb++;pa=0;pb=0;over=gamesOver(t,ga,gb)}
  }
  var tbNow=!over&&isSet&&ga===6&&gb===6,labels;
  if(tbNow)labels=[String(pa),String(pb)];
  else if(pa>=3&&pb>=3)labels=pa===pb?["40","40"]:pa>pb?["Ad","40"]:["40","Ad"];
  else labels=[PTS[pa],PTS[pb]];
  return{ga:ga,gb:gb,pa:pa,pb:pb,labels:labels,tb:tbNow,deuce:!tbNow&&pa>=3&&pa===pb,
    over:over||!!m.ended,started:log.length>0||ga+gb>0||!!m.ended};
}
function roundDone(r){return r.matches.every(function(m){return score(m,T).over})}

function history(t){
  var h={partner:{},opp:{},rests:{},games:{},lastRest:{}};
  t.players.forEach(function(p){h.rests[p.id]=p.restOffset||0;h.games[p.id]=0});
  t.rounds.forEach(function(r,ri){
    r.rest.forEach(function(id){h.rests[id]++;if(ri===t.rounds.length-1)h.lastRest[id]=true});
    r.matches.forEach(function(m){
      var ka=pairKey(m.a[0],m.a[1]),kb=pairKey(m.b[0],m.b[1]);
      h.partner[ka]=(h.partner[ka]||0)+1;h.partner[kb]=(h.partner[kb]||0)+1;
      m.a.forEach(function(x){m.b.forEach(function(y){var k=pairKey(x,y);h.opp[k]=(h.opp[k]||0)+1})});
      m.a.concat(m.b).forEach(function(id){h.games[id]++});
    });
  });
  return h;
}

/* who is ahead: most games won (default), or most matches won */
function rankCmp(t){
  var wins=!!t&&t.rank==="wins";
  var v=function(p,adj,raw){return p[adj]!=null?p[adj]:p[raw]};
  return function(x,y){
    var W=v(y,"adjW","w")-v(x,"adjW","w"),P=v(y,"adjPts","pts")-v(x,"adjPts","pts"),D=v(y,"adjDiff","diff")-v(x,"adjDiff","diff");
    return (wins?W||P||D:P||D||W)||x.name.localeCompare(y.name);
  };
}
/* When people have played different numbers of matches, scale everyone's totals to the same
   number of matches (the most anyone has played) so they can be compared. Games from a match
   still in progress are counted as they are. */
function normalize(t,rows){
  var mx=0;rows.forEach(function(p){mx=Math.max(mx,p.played)});
  /* only people who stayed and played at least three quarters of the most matches are scaled */
  var need=Math.max(1,Math.floor(mx*0.75));
  var ok=function(p){return !p.out&&p.played>=need};
  var on=!!t&&t.norm!==false&&mx>0&&rows.some(function(p){return ok(p)&&p.played<mx});
  rows.forEach(function(p){
    var sc=on&&ok(p),f=sc?mx/p.played:1,live=p.live||0,liveD=p.liveD||0;
    p.adjPts=(p.pts-live)*f+live;p.adjW=p.w*f;p.adjDiff=(p.diff-liveD)*f+liveD;
    p.norm=on;p.scaled=sc;p.normTo=mx;
  });
  return rows;
}
function fmt1(v){return (Math.round(v*10)/10).toFixed(1)}
function standings(t){
  var s={};
  t.players.forEach(function(p){s[p.id]={id:p.id,name:p.name,out:!!p.out,pts:0,w:0,t:0,l:0,diff:0,played:0}});
  t.rounds.forEach(function(r){r.matches.forEach(function(m){
    var sc=score(m,t);
    if(!sc.started)return;
    [[m.a,sc.ga,sc.gb],[m.b,sc.gb,sc.ga]].forEach(function(x){
      x[0].forEach(function(id){
        var p=s[id];if(!p)return;
        p.pts+=x[1];p.diff+=x[1]-x[2];
        if(!sc.over){p.live=(p.live||0)+x[1];p.liveD=(p.liveD||0)+x[1]-x[2];return}
        p.played++;
        if(x[1]>x[2])p.w++;else if(x[1]<x[2])p.l++;else p.t++;
      });
    });
  })});
  return normalize(t,Object.keys(s).map(function(k){return s[k]})).sort(rankCmp(t));
}

function splitCost(h,a,b){
  var pa=h.partner[pairKey(a[0],a[1])]||0,pb=h.partner[pairKey(b[0],b[1])]||0;
  var c=100*(pa*pa+pb*pb);
  a.forEach(function(x){b.forEach(function(y){var o=h.opp[pairKey(x,y)]||0;c+=o*o})});
  return c;
}

/* Americano draw: many random tries, keep the one with the fewest repeated partners and opponents */
function drawAmericano(h,playing,trials){
  var best=null,bestCost=Infinity;
  for(var trial=0;trial<(trials||1500)&&bestCost>0;trial++){
    var s=shuffle(playing),total=0,ms=[];
    for(var i=0;i<s.length;i+=4){
      var g=s.slice(i,i+4);
      var opts=[[[g[0],g[1]],[g[2],g[3]]],[[g[0],g[2]],[g[1],g[3]]],[[g[0],g[3]],[g[1],g[2]]]];
      var bo=null,bc=Infinity;
      opts.forEach(function(o){var c=splitCost(h,o[0],o[1]);if(c<bc){bc=c;bo=o}});
      total+=bc;ms.push(bo);
    }
    if(total<bestCost){bestCost=total;best=ms}
  }
  return best;
}

/* Mexicano draw: by standings, 1st & 3rd against 2nd & 4th, and so on down the table */
function drawMexicano(t,playing){
  var inPlay={};playing.forEach(function(id){inPlay[id]=true});
  var ranked=standings(t).map(function(p){return p.id}).filter(function(id){return inPlay[id]});
  var ms=[];
  for(var i=0;i<ranked.length;i+=4){var g=ranked.slice(i,i+4);ms.push([[g[0],g[2]],[g[1],g[3]]])}
  return ms;
}

function activePlayers(t){return t.players.filter(function(p){return !p.out})}
function addRound(t,trials){
  var h=history(t),act=activePlayers(t),n=act.length;
  var courts=Math.max(1,Math.min(t.courts,Math.floor(n/4)));
  var restCount=n-courts*4;
  var order=shuffle(act.map(function(p){return p.id})).sort(function(a,b){
    return h.rests[a]-h.rests[b]||(h.lastRest[a]?1:0)-(h.lastRest[b]?1:0)||h.games[b]-h.games[a];
  });
  var rest=order.slice(0,restCount),playing=order.slice(restCount);
  var pairs=(t.format==="mexicano"&&t.rounds.length>0)?drawMexicano(t,playing):drawAmericano(h,playing,trials);
  t.rounds.push({
    rest:rest,
    matches:pairs.map(function(p,i){return{court:i+1,a:p[0],b:p[1],base:[0,0],log:"",ended:false}})
  });
}

/* ---------- fair partner rotation for Americano ----------
   Builds several complete schedules and keeps the fairest one. Half of them use the
   round-robin "circle" rotation, in which no two players partner twice until everyone
   has partnered everyone; the others are drawn round by round. Scores already played
   count, so a redraw mid-tournament avoids the partnerships people have already had. */
function planCost(sim){
  var h=history(sim),ps=0,os=0,lo=Infinity,hi=-Infinity,k;
  for(k in h.partner)ps+=h.partner[k]*h.partner[k];
  for(k in h.opp)os+=h.opp[k]*h.opp[k];
  activePlayers(sim).forEach(function(p){lo=Math.min(lo,h.rests[p.id]);hi=Math.max(hi,h.rests[p.id])});
  var spread=hi-lo;
  return 1e7*spread*spread+1e3*ps+os;
}
function circleBlock(sim,count){
  var ids=shuffle(activePlayers(sim).map(function(p){return p.id}));
  if(ids.length%2)ids.push(null);
  var n=ids.length,courts=Math.max(1,Math.min(sim.courts,Math.floor(activePlayers(sim).length/4)));
  var table=[],r,i;
  for(r=0;r<n-1;r++){
    var ring=ids.slice(1),arr=[ids[0]].concat(ring.slice(r),ring.slice(0,r)),pairs=[];
    for(i=0;i<n/2;i++)pairs.push([arr[i],arr[n-1-i]]);
    table.push(pairs);
  }
  var unused=shuffle(table);
  for(var c=0;c<count;c++){
    if(!unused.length)unused=shuffle(table);
    var h=history(sim);
    /* take the rotation whose pairs have partnered least so far */
    var bi=0,bc=Infinity;
    unused.forEach(function(pairs,idx){
      var cst=0;pairs.forEach(function(p){if(p[0]&&p[1]){var v=h.partner[pairKey(p[0],p[1])]||0;cst+=v*v}});
      if(cst<bc){bc=cst;bi=idx}
    });
    var chosen=unused.splice(bi,1)[0],rest=[],real=[];
    chosen.forEach(function(p){if(!p[0])rest.push(p[1]);else if(!p[1])rest.push(p[0]);else real.push(p)});
    /* pairs that have sat out least sit out now */
    real=shuffle(real).sort(function(x,y){
      return (h.rests[x[0]]+h.rests[x[1]])-(h.rests[y[0]]+h.rests[y[1]])
        ||((h.lastRest[x[0]]?1:0)+(h.lastRest[x[1]]?1:0))-((h.lastRest[y[0]]?1:0)+(h.lastRest[y[1]]?1:0));
    });
    var sitting=real.length-courts*2,playing=real.slice(sitting);
    real.slice(0,sitting).forEach(function(p){rest.push(p[0],p[1])});
    /* decide who faces whom: fewest repeated opponents */
    var best=null,bestC=Infinity;
    for(var t=0;t<120&&bestC>0;t++){
      var sh=shuffle(playing),tot=0;
      for(i=0;i<sh.length;i+=2)sh[i].forEach(function(x){sh[i+1].forEach(function(y){var o=h.opp[pairKey(x,y)]||0;tot+=o*o})});
      if(tot<bestC){bestC=tot;best=sh}
    }
    var ms=[];
    for(i=0;i<best.length;i+=2)ms.push({court:i/2+1,a:best[i].slice(),b:best[i+1].slice(),base:[0,0],log:"",ended:false});
    sim.rounds.push({rest:rest,matches:ms});
  }
}
function planRounds(t,count){
  if(count<1)return;
  var keep=t.rounds.length,best=null,bestCost=Infinity,deadline=Date.now()+350;
  for(var it=0;it<400&&(it<4||Date.now()<deadline);it++){
    var sim={players:t.players,courts:t.courts,format:"americano",rounds:t.rounds.slice(0,keep)};
    if(it%2===0)circleBlock(sim,count);
    else for(var i=0;i<count;i++)addRound(sim,150);
    var c=planCost(sim);
    if(c<bestCost){bestCost=c;best=sim.rounds}
  }
  t.rounds=best;
}

/* ---------- fixed pairs: the same partner all night, every pair plays every other pair ---------- */
function isFixed(t){return t.format==="fixed"}
function fmtName(f){return f==="mexicano"?"Mexicano":f==="fixed"?"Fixed pairs":"Americano"}
function teamActive(t,i){
  var out={};t.players.forEach(function(p){if(p.out)out[p.id]=1});
  var tm=t.teams[i].p;return !out[tm[0]]&&!out[tm[1]];
}
function activeTeams(t){var a=[];t.teams.forEach(function(tm,i){if(teamActive(t,i))a.push(i)});return a}
function teamLabel(t,i){
  var nm={};t.players.forEach(function(p){nm[p.id]=p.name});
  return t.teams[i].p.map(function(id){return nm[id]}).join(" & ");
}
function fixedStats(t){
  var of={},met={},games=t.teams.map(function(){return 0}),last=t.teams.map(function(){return -1});
  t.teams.forEach(function(tm,i){of[tm.p[0]]=i;of[tm.p[1]]=i;(tm.ex||[]).forEach(function(id){of[id]=i})});
  t.rounds.forEach(function(r,ri){r.matches.forEach(function(m){
    var x=of[m.a[0]],y=of[m.b[0]];if(x==null||y==null)return;
    var k=x<y?x+"|"+y:y+"|"+x;met[k]=(met[k]||0)+1;
    games[x]++;games[y]++;last[x]=ri;last[y]=ri;
  })});
  return{of:of,met:met,games:games,last:last};
}
function minMet(t){
  var st=fixedStats(t),act=activeTeams(t),lo=Infinity;
  for(var a=0;a<act.length;a++)for(var b=a+1;b<act.length;b++){
    var k=act[a]+"|"+act[b];lo=Math.min(lo,st.met[k]||0);
  }
  return lo;
}
/* one more round: pairs that have met least, and played least, go first */
function addRoundFixed(t){
  var st=fixedStats(t),act=activeTeams(t);
  if(act.length<2)return false;
  var courts=Math.max(1,Math.min(t.courts,Math.floor(act.length/2))),cands=[],lo=Infinity;
  for(var a=0;a<act.length;a++)for(var b=a+1;b<act.length;b++){
    var i=act[a],j=act[b],m=st.met[i+"|"+j]||0;lo=Math.min(lo,m);
    cands.push({i:i,j:j,met:m,g:st.games[i]+st.games[j],l:st.last[i]+st.last[j],r:Math.random()});
  }
  cands=cands.filter(function(c){return c.met===lo}).sort(function(x,y){return x.g-y.g||x.l-y.l||x.r-y.r});
  var used={},ms=[];
  cands.forEach(function(c){
    if(ms.length>=courts||used[c.i]||used[c.j])return;
    used[c.i]=used[c.j]=1;
    var flip=Math.random()<0.5,x=flip?c.j:c.i,y=flip?c.i:c.j;
    ms.push({court:ms.length+1,a:t.teams[x].p.slice(),b:t.teams[y].p.slice(),base:[0,0],log:"",ended:false});
  });
  var rest=[];act.forEach(function(i){if(!used[i])rest.push(t.teams[i].p[0],t.teams[i].p[1])});
  t.rounds.push({rest:rest,matches:ms});
  return true;
}
/* add rounds until every pair still here has met every other pair; keep the shortest, most even plan */
function planFixed(t){
  if(activeTeams(t).length<2||minMet(t)>=1)return;
  var keep=t.rounds.length,best=null,bestCost=Infinity;
  for(var it=0;it<40;it++){
    var sim={players:t.players,teams:t.teams,courts:t.courts,format:"fixed",rounds:t.rounds.slice(0,keep)},cost=0;
    for(var guard=0;guard<60&&minMet(sim)<1;guard++){
      if(!addRoundFixed(sim))break;
      var g=fixedStats(sim).games,act=activeTeams(sim),hi=-Infinity,lo=Infinity;
      act.forEach(function(i){hi=Math.max(hi,g[i]);lo=Math.min(lo,g[i])});
      cost+=hi-lo;
    }
    cost+=1000*sim.rounds.length;
    if(cost<bestCost){bestCost=cost;best=sim.rounds}
  }
  t.rounds=best;
}
function standingsTeams(t){
  var st=fixedStats(t),rows=t.teams.map(function(tm,i){
    return{id:"t"+i,team:i,name:teamLabel(t,i),out:!teamActive(t,i),pts:0,w:0,t:0,l:0,diff:0,played:0};
  });
  t.rounds.forEach(function(r){r.matches.forEach(function(m){
    var sc=score(m,t);if(!sc.started)return;
    [[st.of[m.a[0]],sc.ga,sc.gb],[st.of[m.b[0]],sc.gb,sc.ga]].forEach(function(x){
      var p=rows[x[0]];if(!p)return;
      p.pts+=x[1];p.diff+=x[1]-x[2];
      if(!sc.over){p.live=(p.live||0)+x[1];p.liveD=(p.liveD||0)+x[1]-x[2];return}
      p.played++;
      if(x[1]>x[2])p.w++;else if(x[1]<x[2])p.l++;else p.t++;
    });
  })});
  return normalize(t,rows).sort(rankCmp(t));
}
function addLatePair(raw){
  if(!T||T.finished||!cloud.canWrite)return;
  var names=String(raw||"").split(/[,&\n]/).map(function(x){return x.trim().replace(/\s+/g," ").slice(0,24)}).filter(Boolean);
  ui.pmsg="";
  if(names.length!==2||sameName(names[0],names[1])){ui.perr="Type the two partners' names with a comma between them.";render();return}
  var clash=null;T.players.forEach(function(p){names.forEach(function(n){if(sameName(p.name,n))clash=p.name})});
  if(clash){ui.perr=clash+" is already in this tournament.";render();return}
  if(T.players.length>=40){ui.perr="40 players in one tournament is the limit.";render();return}
  var max=0;T.players.forEach(function(p){max=Math.max(max,Number(String(p.id).slice(1))||0)});
  var ids=[],grew=false;
  names.forEach(function(n,i){
    var id="p"+(max+1+i);ids.push(id);T.players.push({id:id,name:inRoster(n)||n});
    if(!inRoster(n)){roster.push(n);grew=true}
  });
  if(grew)saveRoster();
  T.teams.push({p:ids});
  lineupChanged();
}

/* ---------- changing the line-up mid-tournament ---------- */
function untouched(t,r){return r.matches.every(function(m){return !score(m,t).started})}
/* someone arriving or returning is treated as having sat out an average number of rounds, so they slot into the rotation fairly */
function levelRests(t,p){
  /* only rounds that have actually started count; the rest are about to be redrawn */
  var h=history({players:t.players,rounds:t.rounds.filter(function(r){return !untouched(t,r)})});
  var others=activePlayers(t).filter(function(x){return x.id!==p.id});
  if(!others.length)return;
  var avg=Math.round(others.reduce(function(sum,x){return sum+h.rests[x.id]},0)/others.length);
  var mine=h.rests[p.id]||0;
  if(avg>mine)p.restOffset=(p.restOffset||0)+(avg-mine);
}
/* throw away rounds nobody has started and draw them again with whoever is here now */
function redraw(t,keep){
  var dropped=0;
  while(t.rounds.length>(keep||0)&&untouched(t,t.rounds[t.rounds.length-1])){t.rounds.pop();dropped++}
  var from=t.rounds.length+1;
  if(isFixed(t))planFixed(t);
  else if(t.format==="americano")planRounds(t,dropped);
  else for(var i=0;i<dropped;i++)addRound(t);
  var added=t.rounds.length-(from-1);
  var who=isFixed(t)?activeTeams(t).length+" pairs":activePlayers(t).length+" players";
  if(added>0)return (added===1?"Round "+from+" was":"Rounds "+from+" to "+(from+added-1)+" were")+" redrawn for "+who+".";
  if(dropped)return "The rounds that had not started were removed. Every pair still here has already played every other pair.";
  return "Every round has already started, so nothing was redrawn. The next round you add will use the new line-up.";
}
function lineupChanged(){
  ui.pmsg=redraw(T);ui.perr="";
  clampRound();
  commit();
}
function addLate(raw){
  var nm=String(raw||"").trim().replace(/\s+/g," ").slice(0,24);
  if(!nm||!T||T.finished||!cloud.canWrite)return;
  var existing=null;T.players.forEach(function(p){if(sameName(p.name,nm))existing=p});
  if(existing){
    if(!existing.out){ui.perr=existing.name+" is already playing.";ui.pmsg="";render();return}
    existing.out=false;levelRests(T,existing);
  }else{
    if(T.players.length>=40){ui.perr="40 players in one tournament is the limit.";ui.pmsg="";render();return}
    var max=0;T.players.forEach(function(p){max=Math.max(max,Number(String(p.id).slice(1))||0)});
    var np={id:"p"+(max+1),name:inRoster(nm)||nm};
    T.players.push(np);levelRests(T,np);
    if(!inRoster(nm)){roster.push(nm);saveRoster()}
  }
  lineupChanged();
}

function gcd(a,b){return b?gcd(b,a%b):a}
/* rounds needed before everyone has sat out the same number of times (1 = any number works) */
function restCycle(n,courts){
  var c=Math.max(1,Math.min(courts,Math.floor(n/4))),rest=n-c*4;
  return rest>0?n/gcd(n,rest):1;
}
/* enough rounds for everyone to partner everyone, rounded up so sit-outs come out equal */
function defaultRounds(n,courts){
  var base=Math.min(15,Math.max(3,n-1)),step=restCycle(n,courts||1);
  var r=Math.ceil(base/step)*step;
  return r<=16?r:base;
}

/* ---------- saving and live sync ---------- */
function commit(){
  cloud.touched=true;
  if(T)T.rev=Date.now();
  store.set(LS,T);
  push();
  render();
}
var writing=false,dirty=false;
function push(){
  if(!cloud.ref||!cloud.canWrite)return;
  if(T&&T.sample)return;
  if(cloud.fb){
    /* Firestore queues and orders writes itself, also while offline */
    var rev=T?T.rev:0;
    (T?cloud.ref.set(clone(T)):cloud.ref.delete()).then(function(){cloud.syncedRev=rev}).catch(function(){});
    return;
  }
  if(writing){dirty=true;return}
  writing=true;
  (async function(){
    try{
      do{
        dirty=false;
        if(T)await cloud.ref.set(clone(T));else await cloud.ref.delete();
      }while(dirty);
    }catch(e){
      if(e&&e.code==="invalid_argument"){cloud.canWrite=false;render()}
    }finally{writing=false}
  })();
}
function clampRound(){
  if(!T){ui.round=0;return}
  if(ui.round>T.rounds.length-1)ui.round=T.rounds.length-1;
  if(ui.round<0)ui.round=0;
}
function firstOpenRound(){
  if(!T)return 0;
  for(var i=0;i<T.rounds.length;i++)if(!roundDone(T.rounds[i]))return i;
  return Math.max(0,T.rounds.length-1);
}

/* ---------- Firebase sync: tournament, saved players, history ---------- */
function loadScript(src){
  return new Promise(function(ok,no){
    var el=document.createElement("script");el.src=src;el.onload=ok;el.onerror=no;document.head.appendChild(el);
  });
}
function softRender(){
  var keep=["#p-name","#late-name","#late-pair","#paste-text","#reclub-link","#ren-name","#sub-name"].map(function(id){
    var el=$(id);return{id:id,val:el?el.value:"",had:!!el&&document.activeElement===el};
  });
  render();
  keep.forEach(function(k){
    var el=$(k.id);
    if(el&&k.val){el.value=k.val;if(k.had)el.focus()}
  });
}
function saveRoster(){
  store.set(LSR,roster);
  if(!cloud.fb)return;
  store.set(LSRD,true);
  cloud.rosterRef.set({names:roster.slice(),rev:Date.now()}).then(function(){store.set(LSRD,null)}).catch(function(){});
}
function pushRec(rec){
  if(!cloud.fb)return;
  var u=store.get(LSHU)||[];
  if(u.indexOf(rec.id)<0){u.push(rec.id);store.set(LSHU,u)}
  cloud.histRef.doc(String(rec.id)).set(clone(rec)).then(function(){
    store.set(LSHU,(store.get(LSHU)||[]).filter(function(i){return i!==rec.id}));
  }).catch(function(){});
}
function initFirebase(){
  if(!useFb)return;
  var fallback=setTimeout(function(){if(cloud.pending){cloud.pending=false;render()}},7000);
  loadScript(FB_SDK+"firebase-app-compat.js").then(function(){
    return loadScript(FB_SDK+"firebase-firestore-compat.js");
  }).then(function(){
    var fb=window.firebase;
    fb.initializeApp(FIREBASE);
    var db=fb.firestore(),pid=FIREBASE.projectId;
    cloud.fb=true;
    cloud.ref=db.collection("padelito").doc("tournament");
    cloud.rosterRef=db.collection("padelito").doc("roster");
    cloud.histRef=db.collection("padelito_history");

    /* the running tournament */
    cloud.ref.onSnapshot(function(snap){
      var server=!snap.metadata.fromCache;
      if(snap.metadata.hasPendingWrites)return;
      if(server)cloud.live=true;
      if(snap.exists){
        var d=snap.data(),stale=d&&d.rev&&d.rev<=cloud.ignoreRev;
        if(valid(d)&&!stale){
          if(T&&d.rev===T.rev)cloud.syncedRev=d.rev;
          else if(T&&!T.sample&&T.rev>d.rev){if(server)push()}
          else{
            var had=!!T;
            T=clone(d);store.set(LS,T);cloud.syncedRev=d.rev;
            if(!had)ui.round=firstOpenRound();
            clampRound();
          }
        }
      }else if(server&&T&&!T.sample){
        /* nothing online: someone ended it, unless this device has newer unsent scores */
        if(T.rev===cloud.syncedRev||!cloud.touched){T=null;store.set(LS,null)}
        else push();
      }
      if(server||snap.exists){cloud.pending=false;clearTimeout(fallback)}
      softRender();
    },function(){cloud.live=false;cloud.pending=false;render()});

    /* saved players */
    cloud.rosterRef.onSnapshot(function(snap){
      if(snap.metadata.fromCache||snap.metadata.hasPendingWrites)return;
      var data=snap.exists?snap.data():null,names=data&&Array.isArray(data.names)?data.names:null;
      var firstKey="padel.fb.roster."+pid,before=JSON.stringify(roster);
      if(!names){if(roster.length)saveRoster();store.set(firstKey,true);return}
      if(!store.get(firstKey)){
        var merged=names.slice();
        roster.forEach(function(n){if(REGULARS.indexOf(n)<0&&!merged.some(function(m){return sameName(m,n)}))merged.push(n)});
        roster=merged;store.set(firstKey,true);
        if(merged.length!==names.length)saveRoster();else store.set(LSR,roster);
      }else if(store.get(LSRD)){
        if(JSON.stringify(names)===before)store.set(LSRD,null);else saveRoster();
      }else{roster=names.slice();store.set(LSR,roster)}
      draft.players=draft.players.filter(function(nm){return roster.indexOf(nm)>=0});saveDraft();
      if(JSON.stringify(roster)!==before&&!T&&ui.tab==="setup")softRender();
    },function(){});

    /* history */
    cloud.histRef.onSnapshot(function(snap){
      if(snap.metadata.fromCache)return;
      var remote=[],has={},firstKey="padel.fb.hist."+pid,first=!store.get(firstKey),un=store.get(LSHU)||[];
      snap.forEach(function(doc){var r=doc.data();if(r&&r.id&&Array.isArray(r.rows)){remote.push(r);has[r.id]=1}});
      hist.forEach(function(r){
        if(!has[r.id]&&(first||un.indexOf(r.id)>=0)){remote.push(r);has[r.id]=1;pushRec(r)}
      });
      store.set(firstKey,true);
      remote.sort(function(x,y){return String(x.date).localeCompare(String(y.date))});
      if(JSON.stringify(remote)!==JSON.stringify(hist)){
        hist=remote;store.set(LSH,hist);
        if(ui.tab==="history")softRender();
      }
    },function(){});
  }).catch(function(){cloud.pending=false;render()});
}

async function initCloud(){
  if(!hasHost)return;
  var fallback=setTimeout(function(){if(cloud.pending){cloud.pending=false;render()}},12000);
  try{
    var both=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    var db=both[0],user=both[1];
    if(!db){cloud.pending=false;render();return}
    var cw=user?await user.can("data.write"):null;
    if(cw===false)cloud.canWrite=false;
    cloud.ref=db.doc("tournaments/current");
    cloud.ref.onSnapshot(function(snap){
      cloud.live=true;
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      if(snap.exists){
        var d=snap.data();
        var stale=d&&d.rev&&d.rev<=cloud.ignoreRev;
        if(valid(d)&&!stale&&(!T||d.rev!==T.rev)){
          var localNewer=cloud.canWrite&&T&&T.rev>d.rev;
          if(!localNewer){
            var had=!!T;
            T=clone(d);
            if(cloud.canWrite)store.set(LS,T);
            if(!had)ui.round=firstOpenRound();
            clampRound();
          }
        }
      }else if(!cloud.canWrite){T=null}
      cloud.pending=false;clearTimeout(fallback);
      softRender();
    },function(){cloud.live=false;cloud.pending=false;render()});
  }catch(e){cloud.pending=false;render()}
}

function teamName(ids){return ids.map(nameOf).join(" & ")}

  if(fixed&&n>=4){
    if(n%2)summary=n+" players picked. Fixed pairs needs an even number, so add or remove one.";
    else{
      var tm=n/2,total=tm*(tm-1)/2;
      summary=n+" players make "+tm+" pairs on "+courts+(courts===1?" court":" courts")+". Every pair plays every other pair once: "+total+" matches"
        +(tm>courts*2?", with "+(tm-courts*2)+(tm-courts*2===1?" pair":" pairs")+" sitting out each round.":".");
    }
  }
  else if(n<4)summary="Pick at least 4 players to start. "+(n?n+" picked so far.":"");
  else{
    summary=n+" players on "+courts+(courts===1?" court":" courts")+", "+(rest>0?rest+" sit"+(rest===1?"s":"")+" out each round":"nobody sits out")+".";
    if(draft.format==="americano"){
      var dr=defaultRounds(n,courts);
      summary+=" "+dr+" rounds to begin with"+(rest>0&&dr%restCycle(n,courts)===0?", so everyone sits out "+(dr*rest/n)+(dr*rest/n===1?" time":" times"):"")+". You can add more.";
    }
  }
  var fmtHint=draft.format==="americano"
    ?"Partners rotate every round so you play with as many different people as possible."
    :fixed?"You keep the same partner all night. Every pair plays every other pair, and the standings rank pairs."

    for(var pi=0;pi<n;pi+=2){
      pairsHtml+='<li><i>Pair '+(pi/2+1)+'</i>'+[pi,pi+1].map(function(ix){
        return ix<n?'<button type="button" data-act="swap-pick" data-i="'+ix+'" aria-pressed="'+(ui.swap===ix)+'">'+esc(draft.players[ix])+'</button>':'<em>needs a partner</em>';
      }).join("")+'</li>';
    }

  }
  return ''
  +'<h2>New tournament</h2>'
  +'<div class="field"><label for="t-name">Name</label><input type="text" id="t-name" maxlength="40" placeholder="Saturday padel" value="'+esc(draft.name)+'"></div>'
  +'<fieldset class="field"><legend>Format</legend><div class="seg">'
    +seg("format","americano","Americano",draft.format)+seg("format","mexicano","Mexicano",draft.format)+seg("format","fixed","Fixed pairs",draft.format)
  +'</div><p class="hint">'+fmtHint+'</p></fieldset>'
  +'<fieldset class="field"><legend>Match length</legend><div class="seg">'
    +seg("mode","first","First to",draft.mode)+seg("mode","best","Best of",draft.mode)+seg("mode","total","Total",draft.mode)+seg("mode","set","Full set",draft.mode)
  +'</div>'
  +(draft.mode==="set"?'':'<div class="seg" style="margin-top:8px" aria-label="Number of games">'
    +[4,5,6].map(function(g){return seg("n",g,g+" games",draft.n)}).join("")+'</div>')
  +'<p class="hint">'+lenHint(draft)+'</p></fieldset>'
  +'<fieldset class="field"><legend>At 40–40</legend><div class="seg">'
    +seg("deuce","golden","Golden point",draft.deuce)+seg("deuce","adv","Advantage",draft.deuce)
  +'</div><p class="hint">'+(draft.deuce==="golden"?"The next point wins the game.":"A pair has to win two points in a row from deuce.")+'</p></fieldset>'
  +'<fieldset class="field"><legend>Winner decided by</legend><div class="seg">'
    +seg("rank","games","Games won",draft.rank)+seg("rank","wins","Matches won",draft.rank)
  +'</div><p class="hint">'+(draft.rank==="wins"?"Most matches won is first. Games won breaks a tie.":"Most games won is first. Game difference breaks a tie.")+' You can change this during or after the tournament.</p></fieldset>'
  +'<fieldset class="field"><legend>Courts</legend><div class="stepper">'
    +'<button type="button" data-act="courts" data-d="-1" aria-label="One court fewer">−</button>'
    +'<output>'+draft.courts+'</output>'
    +'<button type="button" data-act="courts" data-d="1" aria-label="One court more">+</button></div></fieldset>'
  +'<div class="field"><label for="p-name">Players</label><div class="add">'

    +'<button type="button" class="btn" data-act="add-player">Add player</button></div>'

    +(ui.err?'<p class="error" role="alert">'+esc(ui.err)+'</p>':'')
    +(roster.length?'<ul class="chips">'+roster.map(function(p,i){
        var on=draft.players.indexOf(p)>=0;
        return '<li class="'+(on?"on":"")+'"><button type="button" class="who" data-act="toggle-player" data-i="'+i+'" aria-pressed="'+on+'">'+esc(p)+'</button>'
          +'<button type="button" class="x" data-act="remove-player" data-i="'+i+'" aria-label="Delete '+esc(p)+' from saved players">×</button></li>'}).join("")+'</ul>'

function seg(key,val,label,cur){
  return '<button type="button" data-act="set" data-k="'+key+'" data-v="'+val+'" aria-pressed="'+(String(cur)===String(val))+'">'+label+'</button>';
}

function viewBig(){

  var i=Math.max(0,Math.min(ui.big,T.rounds.length-1)),r=T.rounds[i];
  return '<div class="big" role="dialog" aria-modal="true" aria-label="Round '+(i+1)+'"><div class="big-in"><h2>Round '+(i+1)+'</h2>'
    +r.matches.map(function(m){
      var sc=score(m,T),f=flipped(m,sc),x=f?m.b:m.a,y=f?m.a:m.b;
      var state=sc.over?", finished "+(f?sc.gb:sc.ga)+"–"+(f?sc.ga:sc.gb):sc.started?", playing now":"";
      return '<div class="crt"><h3>Court '+m.court+state+'</h3><p class="pr">'+esc(teamName(x))+'</p><p class="vs">against</p><p class="pr">'+esc(teamName(y))+'</p></div>';
    }).join("")
    +(r.rest.length?'<p class="rest">Sitting out: <strong>'+r.rest.map(function(id){return esc(nameOf(id))}).join(", ")+'</strong></p>':'')
    +'<div class="row" style="margin-top:8px">'
    +'<button type="button" class="btn" data-act="big-go" data-d="-1"'+(i>0?"":" disabled")+'>Previous round</button>'
    +'<button type="button" class="btn" data-act="big-go" data-d="1"'+(i<T.rounds.length-1?"":" disabled")+'>Next round</button>'
    +'<button type="button" class="btn primary" data-act="big-close">Close</button></div></div></div>';

function anyStarted(t){return t.rounds.some(function(r){return r.matches.some(function(m){return score(m,t).started})})}
function viewMatches(){
  var r=T.rounds[ui.round],last=ui.round===T.rounds.length-1,html="";
  html+='<div class="rounds" aria-label="Rounds">'+T.rounds.map(function(x,i){
    return '<button type="button" data-act="round" data-i="'+i+'" class="'+(roundDone(x)?"done":"")+'" aria-current="'+(i===ui.round)+'" aria-label="Round '+(i+1)+(roundDone(x)?", played":"")+'">'+(i+1)+'</button>';
  }).join("")+'</div>';
  html+='<h2>Round '+(ui.round+1)+'<small>of '+T.rounds.length+'</small></h2>'
    +'<button type="button" class="btn small" style="margin-bottom:14px" data-act="big-open">Show this round big</button>';
  r.matches.forEach(function(m,mi){
    html+='<article class="match"><h3>Court '+m.court+'</h3><div class="court"><div class="lines">'
      +half(m,mi,flipped(m,score(m,T))?"b":"a","a")+half(m,mi,flipped(m,score(m,T))?"a":"b","b")+'</div></div></article>';
  });
  if(r.rest.length)html+='<p class="rest">Sitting out: <strong>'+r.rest.map(function(id){return esc(nameOf(id))}).join(", ")+'</strong></p>';
  if(!T.finished&&roundDone(r)&&!last)html+='<button type="button" class="btn primary block" style="margin-bottom:10px" data-act="big-next">Show who plays next (round '+(ui.round+2)+')</button>';
  if(T.finished)html+='<p class="hint">This tournament is finished. The final results are under Standings.</p>';
  if(cloud.canWrite&&last&&!T.finished){
    if(T.format==="mexicano"){
      var ok=roundDone(r);
      html+='<button type="button" class="btn primary block" data-act="next-round"'+(ok?"":" disabled")+'>Draw next round</button>';
      if(!ok)html+='<p class="hint">Enter every score in this round first. The next draw depends on the standings.</p>';
    }else{
      html+='<button type="button" class="btn block" data-act="next-round">Add a round</button>';
      var hr=history(T),lo=Infinity,hi=-Infinity,act=activePlayers(T);
      act.forEach(function(p){lo=Math.min(lo,hr.rests[p.id]);hi=Math.max(hi,hr.rests[p.id])});
      if(hi>lo){
        var plain=act.length===T.players.length&&!T.players.some(function(p){return p.restOffset}),cyc=restCycle(act.length,T.courts);
        var more=(cyc-T.rounds.length%cyc)%cyc;
        html+='<p class="hint">Sit-outs are not equal yet'+(plain&&more?': '+more+(more===1?' more round evens':' more rounds even')+' them out.':'. Adding rounds evens them out.')+'</p>';
      }

  if(cloud.canWrite&&!T.finished&&anyStarted(T)){

      +'<p class="hint">Saves the results to History.'+(allDone?'':' Rounds you have not played are left out.')+'</p>';
  }
  if(cloud.canWrite&&!T.finished){
    html+='<button type="button" class="linkish" data-act="tab" data-t="tournament">Someone left or arrived? Change players</button>';
  }

}
function half(m,mi,side,pos){
  var sc=score(m,T),ids=m[side],i=side==="a"?0:1;
  var mine=i?sc.gb:sc.ga,theirs=i?sc.ga:sc.gb;
  var win=sc.over&&mine>theirs;
  var names='<span class="names">'+ids.map(function(id){return '<span><b>'+esc(nameOf(id))+'</b></span>'}).join("")+'</span>';
  var block='<span class="score'+(sc.started?"":" none")+'"><span class="g">'+(sc.started?mine:"–")+'</span>'
    +(sc.started&&!sc.over?'<span class="pt">'+sc.labels[i]+'</span>':'')+'</span>';
  var inner=pos==="a"?names+block:block+names;
  var cls='half '+pos+(win?" win":"");
  if(!cloud.canWrite||T.finished)return '<div class="'+cls+'">'+inner+'</div>';
  return '<button type="button" class="'+cls+'" data-act="score" data-m="'+mi+'" aria-label="'
    +esc(teamName(ids))+', '+(sc.started?mine+" games"+(sc.over?"":", "+sc.labels[i]):"not started")+'. Open scoring">'+inner+'</button>';
}

function viewStandings(){
  var fixed=isFixed(T),rows=fixed?standingsTeams(T):standings(T),any=rows.some(function(p){return p.played>0||p.pts>0});
  var gone={};T.players.forEach(function(p){if(p.out)gone[p.id]=1});
  rows.forEach(function(p){if(p.out)gone[p.id]=1});
  var norm=!!(rows.length&&rows[0].norm),byWins=T.rank==="wins";
  var adjOf=function(p){return fmt1(byWins?p.adjW:p.adjPts)};
  var html='<h2>'+(T.finished?"Final results":"Standings")+'</h2>';
  if(T.finished&&any){
    var c=rows[0];
    html+='<div class="champ"><p class="champ-l">'+(fixed?"Winners":"Winner")+'</p><p class="champ-n">'+esc(c.name)+'</p>'
      +'<p class="champ-s">'+(c.scaled?adjOf(c)+' adjusted, ':'')+c.pts+' games won, '+c.w+(c.w===1?" win":" wins")+' from '+c.played+(c.played===1?" match":" matches")+'</p></div>';
  }
  if(!any)html+='<p class="hint" style="margin:0 0 12px">No scores yet. The table counts games won and updates as they are played.</p>';
  html+='<div class="table-scroll"><table><thead><tr><th>#</th><th>'+(fixed?"Pair":"Player")+'</th><th>Played</th><th>W–T–L</th><th>Diff</th><th>Games won</th>'+(norm?'<th>Adjusted</th>':'')+'</tr></thead><tbody>'
    +rows.map(function(p,i){
      return '<tr class="'+(i===0&&any?"lead":"")+'"><td>'+(i+1)+'</td><td class="name">'+esc(p.name)+(gone[p.id]?'<span class="tag">left</span>':'')+'</td><td>'+p.played+'</td><td>'
        +p.w+'–'+p.t+'–'+p.l+'</td><td>'+(p.diff>0?"+":"")+p.diff+'</td>'
        +(norm?'<td>'+p.pts+'</td><td class="pts">'+(p.scaled?adjOf(p):(byWins?p.w:p.pts))+'</td>':'<td class="pts">'+p.pts+'</td>')+'</tr>';
    }).join("")+'</tbody></table></div>';
  if(norm)html+='<p class="hint">Adjusted scales each '+(fixed?"pair":"player")+"'s "+(byWins?"wins":"games")+' to '+rows[0].normTo+' matches, the most anyone has played, so totals compare fairly. '
    +'Anyone who left early, or played fewer than three quarters of that, keeps their score as played. You can turn this off on the Tournament tab.</p>';
  html+='<p class="hint">Games won is the total across all matches, and Diff is games won minus games lost. Ranked by '+(norm?"adjusted ":"")+(T.rank==="wins"?"matches won, then games won":"games won, then game difference")+'. Change this on the Tournament tab.</p>';
  if(T.finished&&any)html+='<div class="row" style="margin-top:12px">'+shareButtons("cur")+'</div>';
  if(!norm&&rows.some(function(p){return p.played!==rows[0].played}))html+='<p class="hint">Not everyone has played the same number of matches, so compare the Played column before calling a winner.</p>';
  return html;
}

function viewTournament(){
  var played=T.rounds.filter(roundDone).length;
  var html='<h2>Tournament</h2><div class="card"><dl>'

function fmtDate(d){
  try{return new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}catch(e){return""}
}
function shortDate(d){
  try{return new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short"})}catch(e){return""}
}
function isWinner(rec,r,i){
  if(rec.winners)return rec.winners.some(function(n){return sameName(n,r.name)});
  return i===0;
}
function allTime(){
  var map={};
  hist.forEach(function(rec){rec.rows.forEach(function(r,i){
    var k=r.name.trim().toLowerCase();
    var p=map[k]||(map[k]={name:r.name,events:0,titles:0,played:0,w:0,t:0,l:0,pts:0,diff:0});
    p.name=r.name;p.events++;if(isWinner(rec,r,i)&&r.played>0)p.titles++;
    p.played+=r.played;p.w+=r.w;p.t+=r.t;p.l+=r.l;p.pts+=r.pts;p.diff+=r.diff;
  })});
  var list=Object.keys(map).map(function(k){var p=map[k];p.avg=p.played?p.pts/p.played:0;p.win=p.played?p.w/p.played:0;return p});
  var key=ui.hsort;
  /* ties go to the better win rate, then games per match, then game difference */
  return list.sort(function(x,y){return y[key]-x[key]||y.win-x.win||y.avg-x.avg||y.diff-x.diff||y.pts-x.pts||x.name.localeCompare(y.name)});
}
function ordinal(n){var v=n%100;if(v>10&&v<14)return n+"th";return n+(["th","st","nd","rd"][n%10]||"th")}
function bump(map,n,gf,ga){
  var k=n.trim().toLowerCase(),o=map[k]||(map[k]={name:n,played:0,w:0,t:0,l:0,gf:0,ga:0});
  o.name=n;o.played++;o.gf+=gf;o.ga+=ga;
  if(gf>ga)o.w++;else if(gf<ga)o.l++;else o.t++;
}
function playerSummary(name){
  var s={name:name,events:0,titles:0,played:0,w:0,t:0,l:0,pts:0,diff:0,best:null,finSum:0,nights:[],partners:{},opps:{},hasMatches:false};
  function me(n){return sameName(n,name)}
  hist.forEach(function(rec){
    var idx=-1;rec.rows.forEach(function(r,i){if(me(r.name))idx=i});
    if(idx<0)return;
    var r=rec.rows[idx];
    s.name=r.name;s.events++;if(isWinner(rec,r,idx)&&r.played>0)s.titles++;
    s.played+=r.played;s.w+=r.w;s.t+=r.t;s.l+=r.l;s.pts+=r.pts;s.diff+=r.diff;
    var pos=r.pos||idx+1;
    s.best=s.best==null?pos:Math.min(s.best,pos);s.finSum+=pos;
    s.nights.push({rec:rec,row:r,pos:pos,of:rec.of||rec.rows.length});
    (rec.matches||[]).forEach(function(m){
      var side=m.a.some(me)?"a":m.b.some(me)?"b":null;if(!side)return;
      s.hasMatches=true;
      var mine=side==="a"?m.a:m.b,theirs=side==="a"?m.b:m.a,gf=side==="a"?m.ga:m.gb,ga=side==="a"?m.gb:m.ga;
      mine.forEach(function(n){if(!me(n))bump(s.partners,n,gf,ga)});
      theirs.forEach(function(n){bump(s.opps,n,gf,ga)});
    });
  });
  return s;
}
function pairTable(map,label){
  var list=Object.keys(map).map(function(k){return map[k]}).sort(function(x,y){
    return y.w/y.played-x.w/x.played||y.played-x.played||(y.gf-y.ga)-(x.gf-x.ga)||x.name.localeCompare(y.name)});
  return '<div class="table-scroll"><table><thead><tr><th>#</th><th>'+label+'</th><th>Matches</th><th>W–T–L</th><th>Games won–lost</th></tr></thead><tbody>'
    +list.map(function(o,i){
      return '<tr><td>'+(i+1)+'</td><td class="name">'+esc(o.name)+'</td><td>'+o.played+'</td><td>'+o.w+'–'+o.t+'–'+o.l+'</td><td>'+o.gf+'–'+o.ga+'</td></tr>';
    }).join("")+'</tbody></table></div>';
}
function viewPlayer(name){

  function stat(v,l){return '<div><b>'+v+'</b><span>'+l+'</span></div>'}
  html+='<div class="stats">'
    +stat(p.events,p.events===1?"Tournament":"Tournaments")+stat(p.titles,p.titles===1?"Title":"Titles")+stat(ordinal(p.best),"Best finish")
    +stat(p.played,"Matches")+stat(p.w+'–'+p.t+'–'+p.l,"W–T–L")+stat((p.played?Math.round(p.w/p.played*100):0)+'%',"Win rate")
    +stat(p.pts,"Games won")+stat((p.diff>0?"+":"")+p.diff,"Game diff")+stat(p.played?(p.pts/p.played).toFixed(1):"0.0","Per match")
    +'</div>';
  html+='<h2>Tournament by tournament</h2><div class="table-scroll"><table class="free"><thead><tr><th>Finish</th><th>Tournament</th><th>W–T–L</th><th>Diff</th><th>Games won</th></tr></thead><tbody>'
    +p.nights.slice().reverse().map(function(n){
      return '<tr><td>'+ordinal(n.pos)+' of '+n.of+'</td><td>'+esc(n.rec.name)+'<small>'+esc(fmtDate(n.rec.date))+'</small></td><td>'
        +n.row.w+'–'+n.row.t+'–'+n.row.l+'</td><td>'+(n.row.diff>0?"+":"")+n.row.diff+'</td><td class="pts">'+n.row.pts+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  if(p.hasMatches){
    html+='<h2>With each partner</h2>'+pairTable(p.partners,"Partner")
      +'<p class="hint">Best partnership first. The last column is games won and lost together.</p>'
      +'<h2>Against each opponent</h2>'+pairTable(p.opps,"Opponent")
      +'<p class="hint">W–T–L is '+esc(p.name)+"'s record when this player was on the other side of the net.</p>";
  }else{
    html+='<p class="hint">Partner and opponent records are kept for tournaments finished from now on.</p>';
  }
  return html;
}

function shareText(rec){
  var lines=["\uD83C\uDFC6 *"+rec.name+"*",fmtDate(rec.date)+" \u00B7 "+fmtName(rec.format)+", "+rec.len,""];
  var groups=[];
  rec.rows.forEach(function(r,i){
    var pos=r.pos||i+1,last=groups[groups.length-1];
    if(rec.of&&last&&last.pos===pos)last.names.push(r.name);
    else groups.push({pos:pos,names:[r.name],r:r});
  });
  if(groups.length&&groups[0].r.played>0)lines.push((groups[0].names.length>1?"Winners":"Winner")+": *"+groups[0].names.join(" & ")+"*","");
  groups.forEach(function(g){
    var rec1=g.r.w+"\u2013"+g.r.t+"\u2013"+g.r.l;
    lines.push(g.pos+". "+g.names.join(" & ")+" \u2013 "+(rec.normTo&&g.r.adj!=null
      ?g.r.adj.toFixed(1)+" adjusted ("+g.r.pts+" games in "+g.r.played+" matches, "+rec1+")"
      :g.r.pts+" games ("+rec1+")"));
  });
  lines.push("",rec.normTo?"Adjusted = "+(rec.adjOf||"games")+" scaled to "+rec.normTo+" matches. Record is wins\u2013ties\u2013losses."
    :"Games won (wins\u2013ties\u2013losses)");
  return lines.join("\n");
}
function shareButtons(id){
  return '<button type="button" class="btn primary" data-act="share-wa" data-id="'+id+'">Share to WhatsApp</button>'
    +'<button type="button" class="btn" data-act="share-copy" data-id="'+id+'">Copy results</button>';
}
function copyText(text,el){
  var ok=function(){if(el)el.textContent="Copied"};
  var fallback=function(){
    try{
      var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();ok();
    }catch(e){}
  };
  if(typeof navigator!=="undefined"&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fallback);
  else fallback();
}

/* ---------- renaming a player, or merging two spellings of the same person ---------- */
function allNames(){
  var m={};
  roster.forEach(function(n){m[n.trim().toLowerCase()]=n});
  hist.forEach(function(rec){rec.rows.forEach(function(r){var k=r.name.trim().toLowerCase();if(!m[k])m[k]=r.name})});
  return m;
}
function tryRename(old,raw,confirmed){
  var nm=String(raw||"").trim().replace(/\s+/g," ").slice(0,24);
  if(!ui.ren)ui.ren={};
  ui.ren.val=nm;ui.ren.err="";ui.ren.merge=null;
  if(!nm){ui.ren.err="Type a name.";render();return}
  if(nm===old){ui.ren=null;render();return}
  var target=sameName(nm,old)?null:(allNames()[nm.toLowerCase()]||null);
  if(target){
    var clash=null;
    hist.forEach(function(rec){
      var a=false,b=false;
      rec.rows.forEach(function(r){if(sameName(r.name,old))a=true;if(sameName(r.name,target))b=true});
      if(a&&b&&!clash)clash=rec.name+" ("+fmtDate(rec.date)+")";
    });
    if(!clash&&T){
      var ta=false,tb=false;
      T.players.forEach(function(p){if(sameName(p.name,old))ta=true;if(sameName(p.name,target))tb=true});
      if(ta&&tb)clash="the tournament running now";
    }
    if(clash){ui.ren.err=old+" and "+target+" both played in "+clash+", so they cannot be the same person.";render();return}
    if(!confirmed){ui.ren.merge=target;render();return}
  }
  var fin=target||nm,sw=function(n){return sameName(n,old)?fin:n};
  hist.forEach(function(rec,ix){
    var before=JSON.stringify(rec),c=clone(rec);
    c.rows.forEach(function(r){r.name=sw(r.name)});
    (c.matches||[]).forEach(function(m){m.a=m.a.map(sw);m.b=m.b.map(sw)});
    if(c.winners)c.winners=c.winners.map(sw);
    if(JSON.stringify(c)!==before){hist[ix]=c;pushRec(c)}
  });
  store.set(LSH,hist);
  var nr=[];
  roster.forEach(function(n){n=sw(n);if(!nr.some(function(x){return sameName(x,n)}))nr.push(n)});
  roster=nr;saveRoster();
  var nd=[];

function buildRec(){
  var ms=[];
  T.rounds.forEach(function(r){r.matches.forEach(function(m){
    var sc=score(m,T);if(!sc.started)return;
    ms.push({a:m.a.map(nameOf),b:m.b.map(nameOf),ga:sc.ga,gb:sc.gb});
  })});
  var rec0={};
  var rec={id:T.id,name:T.name,date:new Date().toISOString(),format:T.format,len:lenLabel(T),matches:ms,
    rows:standings(T).map(function(p){
      var row={id:p.id,name:p.name,pts:p.pts,w:p.w,t:p.t,l:p.l,diff:p.diff,played:p.played};
      if(p.scaled&&!isFixed(T)){row.adj=Math.round((T.rank==="wins"?p.adjW:p.adjPts)*10)/10;rec0.normTo=p.normTo;rec0.adjOf=T.rank==="wins"?"wins":"games"}
      return row;
    })};
  if(rec0.normTo){rec.normTo=rec0.normTo;rec.adjOf=rec0.adjOf}
  if(isFixed(T)){
    /* partners share a finishing place; history still keeps one line per player */
    var ranks=standingsTeams(T),place={};
    ranks.forEach(function(tr,ix){T.teams[tr.team].p.concat(T.teams[tr.team].ex||[]).forEach(function(id){place[id]=ix+1})});
    rec.rows.forEach(function(r){r.pos=place[r.id]||ranks.length});
    rec.rows.sort(function(x,y){return x.pos-y.pos});
    rec.of=ranks.length;
    rec.winners=ranks.length?T.teams[ranks[0].team].p.map(nameOf):[];
  }
  rec.rows.forEach(function(r){delete r.id});
  return rec;
}

/* ---------- paste a list of names (from Reclub, WhatsApp, anywhere) ---------- */
var STOP=/^(daftar tunggu|waitlist|waiting list|wait list|cadangan|diundang|invited|reserve|reserves)\b/i;
var HEAD=/^(dikonfirmasi|confirmed|going|peserta|participants|players|pemain|list|hadir)\b/i;
var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{20E3}]/u;
var EMOJI_ALL=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{20E3}\u{FE0F}]/gu;
var MAYBE=/\s+(tentative|tentatif|tbc|tba|maybe|mungkin|nyusul|menyusul|telat|late|waiting|confirm\w*|konfirmasi)\b.*$/i;
/* one line of a list -> the player's name, any note written after it, and whether it is a "+" guest */
function cleanName(line){
  var note=[],x=String(line)
    .replace(/[\u200B-\u200F\u2060-\u2064\uFEFF\u00AD]/g,"")
    .replace(/^\s*[-•*·>]+\s*/,"")
    .replace(/^\s*\(?\d{1,3}\s*[.):\-]?\s+/,"")
    .replace(/^\s*\d{1,3}[.)]\s*/,"")
    .replace(/^@/,"");
  /* a status emoji after the name starts a note: "vanessa 🔴 tentative" */
  var lead=x.replace(/^[\s\u{FE0F}]+/u,""),em=EMOJI.exec(lead);
  while(em&&em.index===0){lead=lead.slice(em[0].length).replace(/^[\s\u{FE0F}]+/u,"");em=EMOJI.exec(lead)}
  x=lead;
  if(em){note.push(x.slice(em.index));x=x.slice(0,em.index)}
  x=x.replace(/\(([^)]*)\)|\[([^\]]*)\]/g,function(_,p1,p2){note.push(p1||p2||"");return " "});
  x=x.replace(/\s[-–—:|]\s(.*)$/,function(_,r){note.push(r);return ""});
  x=x.replace(MAYBE,function(m){note.push(m);return ""});
  var guest=false;
  x=x.replace(/\s*\+\s*\d*\s*$/,function(){guest=true;return ""});
  return{
    name:x.replace(/\s+/g," ").trim(),
    note:note.join(" ").replace(EMOJI_ALL," ").replace(/\s+/g," ").trim().slice(0,40),
    guest:guest
  };
}
/* a whole Reclub meet page pasted in: the players are the lines after "Confirmed · 13" / "Dikonfirmasi · 13" */
var CONF=/^(dikonfirmasi|confirmed|going)\s*[·•:\-(]?\s*(\d{1,3})\b/i;
var CONF_BARE=/^(dikonfirmasi|confirmed|going)\s*[·•:]?$/i;
function hasConfirmed(text){
  return String(text||"").split(/[\n\r]+/).some(function(l){l=l.trim();return CONF.test(l)||CONF_BARE.test(l)});
}
/* where the Reclub link reader lives; it only exists when the site is served by Vercel */
var RECLUB_HELPER="/api/reclub";
function reclubGet(){
  var p=ui.paste;if(!p||p.busy)return;
  var box=$("#reclub-link"),link=(box?box.value:"").trim();
  p.link=link;p.err="";
  var m=/reclub\.co\/(?:[a-z]{2}(?:-[A-Za-z]{2})?\/)?m\/([A-Za-z0-9_-]{3,24})/.exec(link);
  if(!m){p.err="That doesn't look like a Reclub meet link. It should look like reclub.co/m/ABC123.";render();return}
  p.busy=true;render();
  var done=function(err,text){
    if(ui.paste!==p)return;
    p.busy=false;
    if(!err){
      var items=hasConfirmed(text)?readPaste(text):[];
      if(items.length){p.items=items;p.when=meetTime(text);p.text="";render();return}
      err="The meet page opened, but no confirmed players could be read from it. Paste the list instead.";
    }
    p.err=err;render();
  };
  fetch(RECLUB_HELPER+"?url="+encodeURIComponent("https://reclub.co/m/"+m[1])).then(function(r){
    return r.json().then(function(d){return{status:r.status,d:d}},function(){return{status:r.status,d:null}});
  }).then(function(x){
    if(x.d&&x.d.ok)return done(null,x.d.text);
    if(x.status===404||!x.d)return done("The Reclub link reader isn't set up on this address. Open Padelito from its Vercel address, or paste the list instead.");
    done("Reclub didn't return the meet page ("+(x.d.error||x.status)+"). Check the link, or paste the list instead.");
  }).catch(function(){done("Couldn't reach the link reader. Check your connection, or paste the list instead.")});
}
function meetTime(text){
  var m=null;
  String(text||"").split(/[\n\r]+/).some(function(l){
    l=l.trim();
    if(l.length<=40&&/@\s*\d{1,2}[.:]\d{2}/.test(l)){m=l;return true}
    return false;
  });
  return m;
}
function parseNames(text){
  var limit=Infinity,all=String(text||"").split(/[\n\r]+/);
  for(var c=0;c<all.length;c++){
    var ln=all[c].trim(),hit=CONF.exec(ln);
    if(hit){limit=Number(hit[2]);text=all.slice(c+1).join("\n");break}
    if(CONF_BARE.test(ln)){
      var skip=c+1,nx=(all[skip]||"").trim();
      if(/^[·•:]$/.test(nx)){skip++;nx=(all[skip]||"").trim()}
      var cnt=/^[·•:]?\s*(\d{1,3})$/.exec(nx);
      if(cnt){limit=Number(cnt[1]);skip++}
      text=all.slice(skip).join("\n");break;
    }
  }
  var out=[],seen={},guests={},lines=String(text||"").split(/[\n\r,;]+/);
  /* in a numbered list, lines without a number are titles or notes, not players */
  var NUM=/^\s*\(?\d{1,3}\s*[.):\-]?\s*\S/,filled=lines.filter(function(l){return l.trim()}).length;
  var numbered=lines.filter(function(l){return NUM.test(l)}).length>=Math.max(2,filled/2);
  for(var i=0;i<lines.length;i++){
    var raw=lines[i].trim();
    if(!raw)continue;
    if(numbered&&!NUM.test(raw)&&!STOP.test(raw.replace(/^[^A-Za-z\u00C0-\uFFFF]+/,"")))continue;
    var plain=raw.replace(/^[^A-Za-z\u00C0-\uFFFF]+/,"");
    if(STOP.test(plain))break;
    if(HEAD.test(plain)&&/[·:\d]|^\S+$/.test(plain))continue;
    if(/https?:|^\/|www\./i.test(raw))continue;
    var cn=cleanName(raw),nm=cn.name;
    if(!nm||!/[A-Za-z\u00C0-\uFFFF]/.test(nm)||nm.length>30)continue;
    nm=nm.slice(0,cn.guest?20:24).trim();
    if(cn.guest){
      /* "fil +" is a guest fil is bringing: number them fil +1, fil +2 */
      /* "Darwin +1" with no separate line for Darwin means Darwin and a guest */
      if(!seen[nm.toLowerCase()]){seen[nm.toLowerCase()]=1;out.push({name:nm,note:"",guest:false})}
      var gk="+"+nm.toLowerCase();
      guests[gk]=(guests[gk]||0)+1;
      nm=nm+" +"+guests[gk];
    }
    var k=nm.toLowerCase();
    if(seen[k])continue;
    seen[k]=1;out.push({name:nm,note:cn.note,guest:cn.guest});
    if(out.length>=limit)break;
  }
  return out;
}
function keyName(n){return n.toLowerCase().replace(/[^a-z0-9\u00C0-\uFFFF ]/g," ").replace(/\s+/g," ").trim()}
/* find the saved player a pasted name most likely refers to */
function matchSaved(nm,taken){
  var k=keyName(nm),first=k.split(" ")[0],exact=null,close=[];
  roster.forEach(function(r){
    if(taken[r])return;
    var rk=keyName(r),rf=rk.split(" ")[0];
    if(rk===k)exact=r;
    else if((first.length>=3&&rf===first)||(k.length>=3&&rk.indexOf(k+" ")===0)||(rk.length>=3&&k.indexOf(rk+" ")===0))close.push(r);
  });
  if(exact)return{name:exact,exact:true};
  if(close.length===1)return{name:close[0],exact:false};
  return null;
}
function readPaste(text){
  var taken={};
  return parseNames(text).map(function(e){
    var m=e.guest?null:matchSaved(e.name,taken);
    if(m)taken[m.name]=1;
    return{name:e.name,note:e.note,guest:e.guest,match:m?m.name:null,exact:!!(m&&m.exact),use:!!m};
  });
}

function doSub(who){
  var s=ui.sheet;if(!s||!s.sub||!s.sub.out||!T||T.finished||!cloud.canWrite)return;
  var r=T.rounds[s.r],m=r&&r.matches[s.m];if(!m)return;
  var fixed=isFixed(T),outId=s.sub.out,gone=!fixed&&!!s.sub.gone,inP=null,fresh=false,back=false,nm="";
  var fail=function(msg){s.sub.err=msg;render()};
  var onCourt=m.a.concat(m.b);
  if(onCourt.indexOf(outId)<0){s.sub=null;render();return}
  if(who.id)inP=playerById(who.id);
  else{
    nm=String(who.name||"").trim().replace(/\s+/g," ").slice(0,24);
    if(!nm)return fail("Type a name, or tap one of the names.");
    T.players.forEach(function(p){if(sameName(p.name,nm))inP=p});
    if(!inP){
      if(T.players.length>=40)return fail("40 players in one tournament is the limit.");
      fresh=true;
    }
  }
  if(inP){
    if(onCourt.indexOf(inP.id)>=0)return fail(inP.name+" is already on this court.");
    if(fixed)return fail(inP.name+" is already in a pair in this tournament.");
    if(inP.out)back=true;
    else if(r.rest.indexOf(inP.id)<0)return fail(inP.name+" is playing on another court this round.");
  }
  if(!fixed&&activePlayers(T).length+(fresh||back?1:0)-(gone?1:0)<4)return fail("At least 4 players have to stay to keep playing.");
  var outP=playerById(outId),outName=nameOf(outId);

    var max=0;T.players.forEach(function(p){max=Math.max(max,Number(String(p.id).slice(1))||0)});
    inP={id:"p"+(max+1),name:inRoster(nm)||nm};T.players.push(inP);
    if(!inRoster(nm)){roster.push(nm);saveRoster()}
  }
  if(back)inP.out=false;
  if(!fixed&&(fresh||back))levelRests(T,inP);
  var swapIn=function(arr){var i=arr.indexOf(outId);if(i>=0)arr[i]=inP.id};
  var msg="";
  if(fixed){
    T.teams.forEach(function(tm){
      var i=tm.p.indexOf(outId);
      if(i>=0){tm.p[i]=inP.id;(tm.ex=tm.ex||[]).push(outId)}
    });
    for(var k=s.r;k<T.rounds.length;k++){
      T.rounds[k].matches.forEach(function(mm){if(!score(mm,T).over){swapIn(mm.a);swapIn(mm.b)}});
      swapIn(T.rounds[k].rest);
    }
    if(outP)outP.out=true;
  }else{
    swapIn(m.a);swapIn(m.b);

    if(gone){if(outP)outP.out=true}else r.rest.push(outId);
    if(fresh||back||gone)msg=redraw(T,s.r+1);

  s.note=inP.name+" is on for "+outName+"."+(/^Rounds? \d/.test(msg)?" "+msg:"");
  s.sub=null;

}
