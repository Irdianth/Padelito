      +'<p class="sb-p" style="margin-bottom:0">'+(sc.over?"&nbsp;":sc.labels[i])+'</p><p class="sb-cap" style="margin-bottom:10px">'+(sc.over?"&nbsp;":sc.tb?"tiebreak points":"points in this game")+'</p>'
      +'<button type="button" class="btn primary block" data-act="point" data-side="'+side+'"'+(sc.over?" disabled":"")+' aria-label="Point for '+tn+'">Point</button>'
      +'<div class="gstep"><button type="button" data-act="game" data-side="'+side+'" data-d="-1" aria-label="One game fewer for '+tn+'">−</button>'
      +'<span>Games</span><button type="button" data-act="game" data-side="'+side+'" data-d="1" aria-label="One game more for '+tn+'">+</button></div></div>';
  }
  return '<div class="scrim" data-act="close-sheet"></div>'
    +'<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">'
    +'<h2 id="sheet-title">Court '+m.court+(note?'<span class="note">'+note+'</span>':'')+'</h2>'
    +(s.note?'<p class="notice" role="status">'+esc(s.note)+'</p>':'')
    +'<div class="sb">'+(flipped(m,sc)?col("b",1)+col("a",0):col("a",0)+col("b",1))+'</div>'
    +'<p class="hint" style="margin-top:0;margin-bottom:14px">Not tracking every point? Set the games with − and +. That restarts the current game.</p>'
    +'<div class="row">'
    +'<button type="button" class="btn" data-act="undo"'+(m.log&&!m.ended?"":" disabled")+'>Undo last point</button>'
    +(m.ended?'<button type="button" class="btn" data-act="reopen">Reopen match</button>'
      :sc.over?'':'<button type="button" class="btn" data-act="finish">Finish match now</button>')
    +(cloud.canWrite&&!T.finished?'<button type="button" class="btn" data-act="flip">Switch sides</button>':'')
    +(cloud.canWrite&&!sc.over&&!T.finished?'<button type="button" class="btn" data-act="sub-open">Swap a player</button>':'')
    +'<button type="button" class="btn primary" data-act="close-sheet">Done</button></div></div>';
}

function render(){
  var app=$("#app"),tabs=$("#tabs"),status=$("#status"),list;
  $("#title").textContent=T?T.name:"Padelito";
  document.title=T?T.name+" – Padelito":"Padelito";
  if(!T){
    status.hidden=true;ui.sheet=null;
    if(ui.tab!=="history")ui.tab="setup";
    if(cloud.pending){tabs.hidden=true;app.innerHTML='<div class="empty">Loading the tournament…</div>'}
    else if(!cloud.canWrite){tabs.hidden=true;app.innerHTML='<div class="empty"><strong>No tournament running</strong>When the scorekeeper starts one, it shows up here.</div>'}
    else{
      list=[["setup","New tournament"],["history","History"]];
      app.innerHTML=ui.tab==="history"?viewHistory():viewSetup();
    }
  }else{
    if(ui.tab==="setup")ui.tab="matches";
    clampRound();
    status.hidden=false;
    status.className="status"+(cloud.live?" live":"");
    status.innerHTML="<i></i>"+(!cloud.canWrite?"Watching live":cloud.live?"Live":"Saved on this device");
    list=[["matches","Matches"],["standings","Standings"],["tournament","Tournament"],["history","History"]];
    app.innerHTML=ui.tab==="standings"?viewStandings():ui.tab==="tournament"?viewTournament():ui.tab==="history"?viewHistory():viewMatches();
  }
  if(list){
    tabs.hidden=false;
    tabs.innerHTML="<div>"+list.map(function(t){
      return '<button type="button" data-act="tab" data-t="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':"")+'>'+t[1]+'</button>';
    }).join("")+"</div>";
  }
  $("#sheet").innerHTML=viewSheet()||viewBig()||(T?"":viewPaste());
  $("#undo").innerHTML=ui.undo?'<div class="undo" role="status"><span>'+esc(ui.undo.label)+'</span><button type="button" data-act="undo-do">Undo</button></div>':"";
}

/* ---------- actions ---------- */
function saveDraft(){store.set(LSD,draft)}
function refocus(act,side,d){
  var sel='.sheet [data-act="'+act+'"]'+(side?'[data-side="'+side+'"]':'')+(d?'[data-d="'+d+'"]':'');
  var el=document.querySelector(sel);
  if(!el||el.disabled)el=document.querySelector('.sheet .btn.primary[data-act="close-sheet"]');
  if(el&&el.focus)el.focus();
}
function addPlayers(){
  var input=$("#p-name");if(!input)return;
  var names=input.value.split(/[,\n]/).map(function(x){return x.trim().replace(/\s+/g," ")}).filter(Boolean);
  ui.err="";
  names.forEach(function(nm){
    nm=nm.slice(0,24);
    var saved=inRoster(nm);
    if(!saved){
      if(roster.length>=60){ui.err="60 saved players is the limit. Delete one you no longer need.";return}
      roster.push(nm);saved=nm;
    }
    if(draft.players.indexOf(saved)<0){
      if(draft.players.length>=40)ui.err="40 players in one tournament is the limit.";
      else draft.players.push(saved);
    }
  });
  saveRoster();saveDraft();render();
  var again=$("#p-name");if(again)again.focus();
}
function start(){
  var n=draft.players.length;if(n<4)return;
  if(draft.format==="fixed"&&n%2)return;
  T={v:2,id:Date.now(),name:(draft.name||"").trim()||"Padel night",format:draft.format,rank:draft.rank,mode:draft.mode,n:Number(draft.n),deuce:draft.deuce,
     courts:Math.max(1,Math.min(draft.courts,Math.floor(n/4))),
     players:draft.players.map(function(nm,i){return{id:"p"+(i+1),name:nm}}),rounds:[],rev:0};
  if(isFixed(T)){
    T.courts=Math.max(1,Math.min(draft.courts,Math.floor(n/4)));
    T.teams=[];
    for(var k=0;k<n;k+=2)T.teams.push({p:["p"+(k+1),"p"+(k+2)]});
    planFixed(T);
  }
  else if(T.format==="americano")planRounds(T,defaultRounds(n,T.courts));
  else addRound(T);
  ui.undo=null;ui.big=null;
  ui.swap=null;ui.round=0;ui.tab="matches";ui.confirmEnd=false;
  commit();window.scrollTo(0,0);
}

/* a made-up finished tournament, so you can see what the results look like */
function sample(){
  var names=["Budi","Dimas","Rizky","Fajar","Yoga","Andre","Kevin","Reza"],skill={};
  T={v:2,sample:true,name:"Sample night",format:"americano",mode:"first",n:6,deuce:"golden",courts:2,
     players:names.map(function(nm,i){skill["p"+(i+1)]=Math.random();return{id:"p"+(i+1),name:nm}}),rounds:[],rev:0};
  for(var i=0;i<7;i++)addRound(T);
  T.rounds.forEach(function(r){r.matches.forEach(function(m){
    var sa=skill[m.a[0]]+skill[m.a[1]],sb=skill[m.b[0]]+skill[m.b[1]];
    var aWins=Math.random()<0.5+(sa-sb)*0.35,lose=Math.floor(Math.random()*5)+1;
    m.base=aWins?[6,lose]:[lose,6];
  })});
  T.finished=true;ui.tab="standings";ui.round=0;ui.confirmEnd=false;
  commit();window.scrollTo(0,0);
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.dataset.act;
  switch(act){
    case "set":
      draft[el.dataset.k]=el.dataset.k==="n"?Number(el.dataset.v):el.dataset.v;saveDraft();render();break;
    case "courts":
      draft.courts=Math.max(1,Math.min(10,draft.courts+Number(el.dataset.d)));saveDraft();render();break;
    case "add-player":addPlayers();break;
    case "toggle-player":ui.swap=null;
      var nm=roster[Number(el.dataset.i)],at=draft.players.indexOf(nm);ui.err="";
      if(at>=0)draft.players.splice(at,1);
      else if(draft.players.length>=40)ui.err="40 players in one tournament is the limit.";
      else draft.players.push(nm);
      saveDraft();render();break;
    case "remove-player":ui.swap=null;
      var gone=roster.splice(Number(el.dataset.i),1)[0];
      draft.players=draft.players.filter(function(x){return x!==gone});
      ui.err="";saveRoster();saveDraft();render();break;
    case "hsort":ui.hsort=el.dataset.v;render();break;
    case "player":ui.ren=null;ui.player=el.dataset.n;render();window.scrollTo(0,0);break;
    case "share-wa":case "share-copy":
      var srec=null;
      if(el.dataset.id==="cur"){if(T)srec=buildRec()}
      else hist.forEach(function(r){if(String(r.id)===el.dataset.id)srec=r});
      if(!srec)break;
      if(act==="share-copy")copyText(shareText(srec),el);
      else window.open("https://wa.me/?text="+encodeURIComponent(shareText(srec)),"_blank");
      break;
    case "ren-open":ui.ren={val:null,err:"",merge:null};render();var rnb=$("#ren-name");if(rnb&&rnb.focus)rnb.focus();break;
    case "ren-cancel":ui.ren=null;render();break;
    case "ren-save":var rn=$("#ren-name");tryRename(ui.player,rn?rn.value:"",false);break;
    case "ren-merge":if(ui.ren&&ui.ren.merge)tryRename(ui.player,ui.ren.merge,true);break;
    case "player-back":ui.ren=null;ui.player=null;render();window.scrollTo(0,0);break;
    case "ask-del":ui.confirmDel=Number(el.dataset.id);render();reopenDetails(ui.confirmDel);break;
    case "keep-rec":var keep=ui.confirmDel;ui.confirmDel=null;render();reopenDetails(keep);break;
    case "del-rec":
      var drec=null;hist.forEach(function(r){if(r.id===Number(el.dataset.id))drec=r});
      dropHistory(Number(el.dataset.id));ui.confirmDel=null;
      if(drec)setUndo({kind:"del",rec:clone(drec),label:"Deleted from history."});
      render();break;
    case "undo-do":
      var u=ui.undo;ui.undo=null;clearTimeout(undoTimer);
      if(!u){render();break}
      if(u.kind==="end"){
        if(T){render();break}
        T=u.T;ui.tab=T.finished?"standings":"matches";ui.round=firstOpenRound();
        if(T.sample){store.set(LS,T);render()}else commit();
      }else{
        if(!hist.some(function(r){return r.id===u.rec.id})){
          hist.push(u.rec);hist.sort(function(x,y){return String(x.date).localeCompare(String(y.date))});
          store.set(LSH,hist);pushRec(u.rec);
        }
        render();
      }
      window.scrollTo(0,0);break;
    case "big-open":ui.big=ui.round;render();break;
    case "big-next":if(T){ui.round=Math.min(ui.round+1,T.rounds.length-1);ui.big=ui.round;render()}break;
    case "big-go":if(T&&ui.big!=null){ui.big=Math.max(0,Math.min(T.rounds.length-1,ui.big+Number(el.dataset.d)));ui.round=ui.big;render()}break;
    case "big-close":ui.big=null;render();break;
    case "backup":backup();break;
    case "start":start();break;
    case "p-out":case "p-back":
      if(T&&cloud.canWrite&&!T.finished){
        var who=null;T.players.forEach(function(x){if(x.id===el.dataset.id)who=x});
        if(!who)break;
        if(act==="p-out"){
          if(activePlayers(T).length<=4){ui.perr="At least 4 players have to stay to keep playing.";ui.pmsg="";render();break}
          who.out=true;
        }else{who.out=false;levelRests(T,who)}
        lineupChanged();
      }break;
    case "paste-open":ui.paste={items:null,text:"",err:"",link:"",busy:false};render();break;
    case "paste-close":ui.paste=null;render();break;
    case "reclub-get":reclubGet();break;
    case "paste-read":
      if(ui.paste){
        var box=$("#paste-text"),txtv=box?box.value:"",items=readPaste(txtv);
        ui.paste.text=txtv;
        if(!items.length){ui.paste.err="No names found. Paste one name per line, or separate them with commas.";render();var b2=$("#paste-text");if(b2)b2.value=txtv}
        else{ui.paste.items=items;ui.paste.when=meetTime(txtv);ui.paste.err="";render()}
      }break;
    case "paste-back":if(ui.paste){var keepT=ui.paste.text;ui.paste.items=null;render();var b3=$("#paste-text");if(b3)b3.value=keepT}break;
    case "paste-toggle":if(ui.paste&&ui.paste.items){var pit=ui.paste.items[Number(el.dataset.i)];if(pit){pit.use=!pit.use;render()}}break;
    case "paste-drop":if(ui.paste&&ui.paste.items){ui.paste.items.splice(Number(el.dataset.i),1);render()}break;
    case "paste-apply":
      if(ui.paste&&ui.paste.items&&ui.paste.items.length){
        var picked=[],grew=false;
        ui.paste.items.slice(0,40).forEach(function(it){
          var nmx=it.match&&it.use?it.match:(inRoster(it.name)||it.name);
          if(!inRoster(nmx)){if(roster.length>=60)return;roster.push(nmx);grew=true}
          if(picked.indexOf(nmx)<0)picked.push(nmx);
        });
        if(ui.paste.when&&!(draft.name||"").trim())draft.name=ui.paste.when.slice(0,40);
        draft.players=picked;ui.paste=null;ui.swap=null;ui.err="";
        if(grew)saveRoster();
        saveDraft();render();
      }break;
    case "shuffle-pairs":draft.players=shuffle(draft.players);ui.swap=null;saveDraft();render();break;
    case "swap-pick":
      var ix=Number(el.dataset.i);
      if(ui.swap==null)ui.swap=ix;
      else{
        if(ui.swap!==ix){var tmp=draft.players[ui.swap];draft.players[ui.swap]=draft.players[ix];draft.players[ix]=tmp;saveDraft()}
        ui.swap=null;
      }
      render();break;
    case "tm-out":case "tm-back":
      if(T&&cloud.canWrite&&!T.finished&&isFixed(T)){
        var team=T.teams[Number(el.dataset.i)];if(!team)break;
        if(act==="tm-out"&&activeTeams(T).length<=2){ui.perr="At least 2 pairs have to stay to keep playing.";ui.pmsg="";render();break}
        T.players.forEach(function(x){if(team.p.indexOf(x.id)>=0)x.out=act==="tm-out"});
        lineupChanged();
      }break;
    case "p-add-pair":var lp=$("#late-pair");if(lp)addLatePair(lp.value);break;
    case "p-add":var late=$("#late-name");if(late)addLate(late.value);break;
    case "p-add-saved":addLate(el.dataset.n);break;
    case "t-courts":
      if(T&&cloud.canWrite&&!T.finished){
        var nc=Math.max(1,Math.min(10,T.courts+Number(el.dataset.d)));
        if(nc===T.courts)break;
        T.courts=nc;lineupChanged();
      }break;
    case "tab":ui.tab=el.dataset.t;ui.confirmEnd=false;ui.confirmDel=null;ui.player=null;ui.ren=null;ui.pmsg="";ui.perr="";render();window.scrollTo(0,0);break;
    case "round":ui.round=Number(el.dataset.i);render();break;
    case "sample":sample();break;
    case "finish-t":
      if(T&&cloud.canWrite&&anyStarted(T)){T.finished=true;recordHistory();ui.tab="standings";ui.sheet=null;commit();window.scrollTo(0,0)}break;
    case "reopen-t":
      if(T&&cloud.canWrite){T.finished=false;if(T.id)dropHistory(T.id);commit()}break;
    case "score":
      if(!cloud.canWrite||T.finished)break;
      ui.sheet={r:ui.round,m:Number(el.dataset.m)};render();refocus("close-sheet");
      break;
    case "point":case "undo":case "game":case "finish":case "reopen":
      if(ui.sheet&&T&&cloud.canWrite&&!T.finished){
        var m=T.rounds[ui.sheet.r].matches[ui.sheet.m],sc=score(m,T),side=el.dataset.side;
        if(act==="point"){if(sc.over)break;m.log=(m.log||"")+side}
        else if(act==="undo"){if(!m.log||m.ended)break;m.log=m.log.slice(0,-1)}
        else if(act==="game"){
          var g=[sc.ga,sc.gb],i=side==="a"?0:1,r=ml(T);
          var max=r.mode==="set"?7:(r.mode==="first"?r.n:r.n-g[1-i]);
          g[i]=Math.max(0,Math.min(max,g[i]+Number(el.dataset.d)));
          m.base=g;m.log="";
        }
        else if(act==="finish")m.ended=true;
        else m.ended=false;
        commit();refocus(act,side,el.dataset.d);
      }break;
    case "close-sheet":ui.sheet=null;render();break;
    case "flip":
      if(ui.sheet&&T&&cloud.canWrite&&!T.finished){
        var fm=T.rounds[ui.sheet.r].matches[ui.sheet.m];
        if(fm){fm.flip=!fm.flip;commit();refocus("flip")}
      }break;
    case "sub-open":if(ui.sheet&&T&&cloud.canWrite&&!T.finished){ui.sheet.sub={out:null,gone:false,err:""};ui.sheet.note="";render()}break;
    case "sub-cancel":if(ui.sheet){ui.sheet.sub=null;render()}break;
    case "sub-out":if(ui.sheet&&ui.sheet.sub){ui.sheet.sub.out=el.dataset.id;render()}break;
    case "sub-gone":
      if(ui.sheet&&ui.sheet.sub){
        var sbx=$("#sub-name"),sbv=sbx?sbx.value:"";
        ui.sheet.sub.gone=el.dataset.v==="1";render();
        var sby=$("#sub-name");if(sby&&sbv)sby.value=sbv;
      }break;
    case "sub-in":doSub(el.dataset.id?{id:el.dataset.id}:{name:el.dataset.n});break;
    case "sub-in-new":var sbn=$("#sub-name");doSub({name:sbn?sbn.value:""});break;
    case "t-norm":
      if(T&&cloud.canWrite){T.norm=el.dataset.v==="1";if(T.finished)recordHistory();commit()}break;
    case "t-auto":if(T&&cloud.canWrite){T.autoSides=el.dataset.v==="1";commit()}break;
    case "t-rank":
      if(T&&cloud.canWrite){
        T.rank=el.dataset.v==="wins"?"wins":"games";
        if(T.finished)recordHistory();
        commit();
      }break;
    case "next-round":
      if(!T||!cloud.canWrite||T.finished)break;
      if(T.format==="mexicano"&&!roundDone(T.rounds[T.rounds.length-1]))break;
      if(isFixed(T)){if(!addRoundFixed(T))break}
      else if(T.format==="americano")planRounds(T,1);else addRound(T);
      ui.round=T.rounds.length-1;commit();window.scrollTo(0,0);break;
    case "ask-end":ui.confirmEnd=true;render();break;
    case "cancel-end":ui.confirmEnd=false;render();break;
    case "end-save":
      if(T&&!T.sample&&cloud.canWrite){
        recordHistory();
        cloud.ignoreRev=T.rev||Date.now();
        setUndo({kind:"end",T:clone(T),label:"Results saved. Tournament ended."});
        T=null;ui.confirmEnd=false;ui.tab="history";ui.round=0;commit();window.scrollTo(0,0);
      }break;
    case "end":
      if(T)setUndo({kind:"end",T:clone(T),label:"Tournament ended."});
      if(T&&T.sample){T=null;store.set(LS,null);ui.confirmEnd=false;ui.tab="setup";ui.round=0;render();window.scrollTo(0,0);break}
      if(T){cloud.ignoreRev=T.rev||Date.now()}
      T=null;ui.confirmEnd=false;ui.tab="setup";ui.round=0;commit();window.scrollTo(0,0);break;
  }
});
function reopenDetails(id){
  var btn=document.querySelector('.past [data-id="'+id+'"]');
  var d=btn&&btn.closest&&btn.closest("details");if(d)d.open=true;
}
function backup(){
  try{
    var blob=new Blob([JSON.stringify({app:"padelito",roster:roster,history:hist},null,1)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="padelito-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
}
document.addEventListener("change",function(e){
  if(e.target.id!=="restore"||!e.target.files||!e.target.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      (d.roster||[]).forEach(function(nm){if(typeof nm==="string"&&nm.trim()&&!inRoster(nm))roster.push(nm.trim().slice(0,24))});
      (d.history||[]).forEach(function(rec){
        if(!rec||!rec.id||!Array.isArray(rec.rows))return;
        if(!hist.some(function(r){return r.id===rec.id})){hist.push(rec);pushRec(rec)}
      });
      hist.sort(function(x,y){return String(x.date).localeCompare(String(y.date))});
      saveRoster();store.set(LSH,hist);
    }catch(err){}
    render();
  };
  fr.readAsText(e.target.files[0]);
});
document.addEventListener("input",function(e){
  if(e.target.id==="t-name"){draft.name=e.target.value;saveDraft()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="p-name"){e.preventDefault();addPlayers()}
  if(e.key==="Enter"&&e.target.id==="late-name"){e.preventDefault();addLate(e.target.value)}
  if(e.key==="Enter"&&e.target.id==="reclub-link"){e.preventDefault();reclubGet()}
  if(e.key==="Enter"&&e.target.id==="sub-name"){e.preventDefault();doSub({name:e.target.value})}
  if(e.key==="Enter"&&e.target.id==="ren-name"){e.preventDefault();tryRename(ui.player,e.target.value,false)}
  if(e.key==="Enter"&&e.target.id==="late-pair"){e.preventDefault();addLatePair(e.target.value)}
  if(e.key==="Escape"&&ui.sheet){ui.sheet=null;render()}
  else if(e.key==="Escape"&&ui.big!=null){ui.big=null;render()}
  else if(e.key==="Escape"&&ui.paste){ui.paste=null;render()}
});

ui.round=firstOpenRound();
render();
initCloud();
initFirebase();
})();
</script>
